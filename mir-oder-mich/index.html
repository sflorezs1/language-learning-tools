<script>
(function () {
'use strict';

/* ---------- Datos ---------- */
/* Pronombres personales. nom = nominativo, akk = acusativo, dat = dativo. */
const P = {
  ich:{nom:'ich',akk:'mich',dat:'mir',lab:'ich',es:'yo',ex:['Er sieht mich.','Él me ve.','Er hilft mir.','Él me ayuda.']},

  es:{nom:'es',akk:'es',dat:'ihm',lab:'es',es:'neutro',note:'«es» sustituye a un sustantivo neutro (das Kind, das Auto). Su dativo es ihm, igual que el de er.',ex:['Ich sehe es.','Lo veo (algo neutro).','Ich helfe ihm.','Le ayudo (a un neutro, como das Kind).']},
  wir:{nom:'wir',akk:'uns',dat:'uns',lab:'wir',es:'nosotros',note:'«uns» es igual en acusativo y dativo: aquí no hay que elegir.',ex:['Er sieht uns.','Él nos ve.','Er hilft uns.','Él nos ayuda.']},
  ihr:{nom:'ihr',akk:'euch',dat:'euch',lab:'ihr',es:'ustedes (informal)',note:'«euch» es igual en acusativo y dativo: aquí no hay que elegir.',ex:['Ich sehe euch.','Los veo.','Ich helfe euch.','Les ayudo.']},
  sie_pl:{nom:'sie',akk:'sie',dat:'ihnen',lab:'sie (ellos)',es:'ellos / ellas',ex:['Ich sehe sie.','Los veo.','Ich helfe ihnen.','Les ayudo.']},
  Sie:{nom:'Sie',akk:'Sie',dat:'Ihnen',lab:'Sie (usted)',es:'usted / ustedes (formal)',note:'«Sie» e «Ihnen» siempre llevan mayúscula.',ex:['Ich sehe Sie.','Lo veo (a usted).','Ich helfe Ihnen.','Le ayudo (a usted).']}
};
const PERSONS = ['ich','du','er','sie','es','wir','ihr','sie_pl','Sie'];
const CASES = {
  nom:{name:'Nominativ',q:'Wer? / Was?'},
  akk:{name:'Akkusativ',q:'Wen? / Was?'},
  dat:{name:'Dativ',q:'Wem?'},
  wech:{name:'Depende',q:'¿wo? / ¿wohin?'}

/* Frases: [oración con ___, persona, caso, categoría, por qué, traducción] */
const RAW = [
/* verbos con dativo */
['Kannst du ___ bitte helfen?','ich','dat','verb','«helfen» lleva dativo: ¿a quién ayudas? → wem?','¿Puedes ayudarme, por favor?'],
['Ich helfe ___ gern.','du','dat','verb','«helfen» lleva dativo.','Te ayudo con gusto.'],
['Wir helfen ___ am Wochenende.','er','dat','verb','«helfen» lleva dativo.','Le ayudamos el fin de semana.'],
['Die Lehrerin hilft ___ bei den Hausaufgaben.','sie_pl','dat','verb','«helfen» lleva dativo.','La profesora les ayuda con la tarea.'],
['Ich danke ___ für die Einladung.','Sie','dat','verb','«danken» lleva dativo.','Le agradezco la invitación.'],
['Das Buch gehört ___.','ich','dat','verb','«gehören» lleva dativo: ¿a quién pertenece? → wem?','El libro es mío.'],
['Gehört das Fahrrad ___?','du','dat','verb','«gehören» lleva dativo.','¿La bicicleta es tuya?'],

['Schmeckt ___ der Kaffee?','Sie','dat','verb','«schmecken» lleva dativo.','¿Le gusta el café?'],
['Die Jacke passt ___ gut.','ich','dat','verb','«passen» lleva dativo.','La chaqueta me queda bien.'],
['Ich antworte ___ morgen.','er','dat','verb','«antworten» lleva dativo, a diferencia de «fragen» (acusativo).','Le respondo mañana.'],
['Hörst du ___ überhaupt zu?','ich','dat','verb','«zuhören» lleva dativo, a diferencia de «hören» (acusativo).','¿Me estás escuchando siquiera?'],
['Wir gratulieren ___ zum Geburtstag.','du','dat','verb','«gratulieren» lleva dativo.','Te felicitamos por tu cumpleaños.'],
['Der Hund folgt ___ überallhin.','sie','dat','verb','«folgen» lleva dativo.','El perro la sigue a todas partes.'],

['___ fehlt meine Familie.','ich','dat','verb','«fehlen» lleva dativo: lo que falta es el sujeto.','Extraño a mi familia.'],
['Tut ___ der Rücken weh?','du','dat','verb','«wehtun» lleva dativo.','¿Te duele la espalda?'],
/* verbos con acusativo */
['Ich sehe ___ im Park.','er','akk','verb','«sehen» lleva acusativo: ¿a quién ves? → wen?','Lo veo en el parque.'],
['Siehst du ___ da drüben?','sie','akk','verb','«sehen» lleva acusativo.','¿La ves allá?'],
['Ich kenne ___ seit drei Jahren.','du','akk','verb','«kennen» lleva acusativo.','Te conozco desde hace tres años.'],
['Er liebt ___ sehr.','sie','akk','verb','«lieben» lleva acusativo.','Él la ama mucho.'],
['Wir besuchen ___ am Sonntag.','Sie','akk','verb','«besuchen» lleva acusativo.','Lo visitamos el domingo (a usted).'],
['Ich rufe ___ später an.','du','akk','verb','«anrufen» lleva acusativo.','Te llamo más tarde.'],
['Kannst du ___ vom Bahnhof abholen?','ich','akk','verb','«abholen» lleva acusativo.','¿Puedes recogerme en la estación?'],
['Ich brauche ___ morgen.','er','akk','verb','«brauchen» lleva acusativo.','Lo necesito mañana.'],

['Verstehst du ___?','ich','akk','verb','«verstehen» lleva acusativo.','¿Me entiendes?'],

['Wir treffen ___ um acht.','sie_pl','akk','verb','«treffen» lleva acusativo.','Los encontramos a las ocho.'],
['Ich mag ___ sehr.','du','akk','verb','«mögen» lleva acusativo.','Me caes muy bien.'],
['Der Arzt untersucht ___ gleich.','ich','akk','verb','«untersuchen» lleva acusativo.','El médico me examina enseguida.'],
['Ich warte auf ___.','er','akk','verb','«warten auf» se construye con acusativo.','Lo espero.'],
['Ich denke oft an ___.','du','akk','verb','«denken an» se construye con acusativo.','Pienso a menudo en ti.'],
['Ich finde ___ nett.','er','akk','verb','«finden» lleva acusativo: ¿a quién encuentro simpático? → wen?','Lo encuentro simpático.'],
['Hast du ___ gestern gesehen?','sie','akk','verb','«sehen» lleva acusativo, también en Perfekt.','¿La viste ayer?'],
['Ich habe ___ gestern angerufen.','du','akk','verb','«anrufen» lleva acusativo.','Te llamé ayer.'],
['Er hat ___ nach Hause gebracht.','ich','akk','verb','Aquí «bringen» tiene un solo objeto, la persona que llevan: acusativo.','Él me llevó a casa.'],
['Kennst du ___?','er','akk','verb','«kennen» lleva acusativo.','¿Lo conoces?'],
['Der Hund beißt ___.','ich','akk','verb','«beißen» lleva acusativo.','El perro me muerde.'],
['Mein Bruder ärgert ___ oft.','ich','akk','verb','«ärgern» lleva acusativo.','Mi hermano me molesta a menudo.'],

['Das interessiert ___ sehr.','ich','akk','verb','«interessieren» lleva acusativo (no es como «gefallen»).','Eso me interesa mucho.'],

['Kannst du ___ das Salz geben?','ich','dat','obj2','Quien recibe la sal va en dativo; la cosa (das Salz) va en acusativo.','¿Me pasas la sal?'],

['Wir kaufen ___ ein Geschenk.','sie','dat','obj2','Para quién compras algo va en dativo.','Le compramos un regalo.'],
['Der Kellner bringt ___ die Speisekarte.','Sie','dat','obj2','Con «bringen» quien recibe va en dativo.','El mesero le trae la carta.'],

['Der Kellner empfiehlt ___ das Fischgericht.','ich','dat','obj2','Con «empfehlen» a quién se lo recomiendan va en dativo.','El mesero me recomienda el plato de pescado.'],
['Ich gebe es ___.','er','dat','obj2','«es» ya es el objeto directo (acusativo), así que la persona va en dativo. Con dos pronombres, primero el acusativo.','Se lo doy.'],
['Ich gebe ___ dem Kind.','es','akk','obj2','La persona ya aparece como «dem Kind» (dativo). El pronombre es la cosa que se da, así que va en acusativo.','Se lo doy al niño.'],
['Ich zeige ___ meiner Mutter.','sie_pl','akk','obj2','La persona es «meiner Mutter» (dativo). «sie» son las cosas que se muestran (por ejemplo las fotos), así que va en acusativo.','Se las muestro a mi mamá.'],

['Wie geht es ___?','Sie','dat','expr','En «Wie geht es …?» la persona va en dativo.','¿Cómo está usted?'],
['Wie geht es ___?','du','dat','expr','En «Wie geht es …?» la persona va en dativo.','¿Cómo estás?'],
['Es geht ___ gut.','ich','dat','expr','En «es geht mir gut» la persona va en dativo.','Estoy bien.'],
['___ ist kalt.','ich','dat','expr','Con sensaciones (kalt, warm, schlecht) la persona va en dativo.','Tengo frío.'],
['Ist ___ warm?','du','dat','expr','Con sensaciones (kalt, warm, schlecht) la persona va en dativo.','¿Tienes calor?'],
['Es tut ___ leid.','ich','dat','expr','«leidtun» lleva dativo.','Lo siento.'],
['Tut es ___ leid?','er','dat','expr','«leidtun» lleva dativo.','¿Lo lamenta él?'],
['Das ist ___ egal.','er','dat','expr','«egal sein» lleva dativo.','Le da igual.'],
['Das ist ___ zu teuer.','ich','dat','expr','Con adjetivos como «zu teuer» o «zu schwer», la persona para quien lo es va en dativo.','Eso es demasiado caro para mí.'],
['Das geht ___ nichts an.','du','akk','expr','«jemanden etwas angehen» lleva acusativo.','Eso no te incumbe.'],
['Das freut ___ sehr.','ich','akk','expr','«freuen» (alegrar) lleva acusativo.','Eso me alegra mucho.'],
['Es stört ___ nicht.','ich','akk','expr','«stören» lleva acusativo.','No me molesta.'],
['Das interessiert ___ nicht.','er','akk','expr','«interessieren» lleva acusativo.','Eso no le interesa.'],
/* preposiciones */
['Kommst du mit ___ ins Kino?','ich','dat','prep','«mit» siempre lleva dativo.','¿Vienes conmigo al cine?'],
['Ich gehe heute Abend zu ___.','du','dat','prep','«zu» siempre lleva dativo.','Esta noche voy a tu casa.'],
['Ich spreche gern mit ___.','er','dat','prep','«mit» siempre lleva dativo.','Me gusta hablar con él.'],

['Ohne ___ gehe ich nicht.','du','akk','prep','«ohne» siempre lleva acusativo.','Sin ti no voy.'],
['Ich bin gegen ___.','er','akk','prep','«gegen» siempre lleva acusativo.','Estoy en contra de él.'],
['Der Brief ist für ___.','Sie','akk','prep','«für» siempre lleva acusativo.','La carta es para usted.'],

['Es geht um ___.','du','akk','prep','«um» siempre lleva acusativo.','Se trata de ti.'],

  const parts = it.s.split('___'); let f = pf(it.p, it.c); if (parts[0] === '') f = cap(f);
  let mid;
  if (state === 0) mid = '<span class="slot">?</span>';
  else mid = '<span class="slot ' + (state === 2 ? 'filled c-' + it.c : 'neutral') + '">' + esc(f) + '</span>';
  return esc(parts[0]) + mid + esc(parts[1]);
}

const artForm = function (it, c) { const f = AF[it.t][it.g][CIDX[c]]; return it.s.indexOf('___') === 0 ? cap(f) : f; };
function fullArt(it) { const parts = it.s.split('___'); return parts[0] + artForm(it, it.c) + parts[1]; }
function sentArt(it, filled) {
  const parts = it.s.split('___');
  const mid = filled ? '<span class="slot filled c-' + it.c + '">' + esc(artForm(it, it.c)) + '</span>' : '<span class="slot">?</span>';
  return esc(parts[0]) + mid + esc(parts[1]);
}

/* ---------- Practicar ---------- */
const WGT = [10, 6, 3, 1.5, 0.5];
const keyOf = function (it) { return S.mode + ':' + it.id; };
function pool() {
  if (S.mode === 'verb') return VITEMS;
  if (S.mode === 'art') return AITEMS.filter(function (it) { return S.filter === 'all' || it.c === S.filter; });
  return ITEMS.filter(function (it) { return S.filter === 'all' || it.cat === S.filter; });
}
function choose() {
  const p = pool();
  const ws = p.map(function (it) { const b = S.box[keyOf(it)] | 0; let w = WGT[Math.min(4, b)]; if (S.recent.indexOf(it.id) >= 0) w *= 0.01; return w; });
  let t = ws.reduce(function (a, b) { return a + b; }, 0) * Math.random();
  for (let i = 0; i < p.length; i++) { t -= ws[i]; if (t <= 0) return p[i]; }
  return p[p.length - 1];
}
function buildOptions(it) {
  if (S.mode === 'art') {
    const seen = {}, o = [], right = artForm(it, it.c);
    ['nom','akk','dat'].forEach(function (c) { const f = artForm(it, c); if (!seen[f]) { seen[f] = 1; o.push({t:f, c:c, ok:f === right}); } });
    return shuffle(o);
  }
  if (S.mode === 'fill') {
    return shuffle([
      {t:cap0(it, 'akk'), c:'akk', ok:it.c === 'akk'},
      {t:cap0(it, 'dat'), c:'dat', ok:it.c === 'dat'}
    ]);
  }
  const o = [{t:'Akkusativ', c:'akk', ok:it.c === 'akk'}, {t:'Dativ', c:'dat', ok:it.c === 'dat'}];
  if (S.mode === 'verb' && it.kind === 'p') o.push({t:'Depende', c:'wech', ok:it.c === 'wech'});
  return o;
}
function cap0(it, c) { const f = pf(it.p, c); return it.s.indexOf('___') === 0 ? cap(f) : f; }
function newQuestion() {
  S.queue.forEach(function (r) { r.wait--; });
  const r = S.queue.find(function (x) { return x.wait <= 0; });
  let it, retry = false;
  if (r) { S.queue.splice(S.queue.indexOf(r), 1); it = r.it; retry = true; }
  else { it = choose(); }
  S.recent.push(it.id); if (S.recent.length > 4) S.recent.shift();
  S.q = {it:it, opts:buildOptions(it), retry:retry};
  S.answered = null;
}
function answer(i) {
  if (S.answered !== null || !S.q || i < 0 || i >= S.q.opts.length) return;
  const q = S.q, ok = q.opts[i].ok, k = keyOf(q.it);
  S.answered = i; S.total++;
  if (ok) { S.correct++; S.streak++; if (S.streak > S.best) S.best = S.streak; S.box[k] = Math.min(4, (S.box[k] | 0) + 1); }
  else { S.streak = 0; S.box[k] = 0; S.queue.push({it:q.it, wait:3 + Math.floor(Math.random() * 3)}); }
  persist(); renderPractice();
}
function nextQ() { newQuestion(); renderPractice(); }
function resetSession() { S.queue = []; S.recent = []; S.q = null; S.answered = null; }

const MODES = [['fill','Completar'],['case','¿Qué caso?'],['verb','Verbos y preposiciones'],['art','Artículos']];
function picksHTML(q, done) {
  const n = q.opts.length;
  return '<div class="picks' + (n === 3 ? ' n3' : '') + '" style="--n:' + n + '">' + q.opts.map(function (o, i) {
    let cls = '';
    if (done) cls = o.ok ? ' ok' : (S.answered === i ? ' bad' : '');
    else if (S.mode !== 'fill' && S.mode !== 'art') cls = ' c-' + o.c;
    return '<button class="pick' + cls + '" data-opt="' + i + '"' + (done ? ' disabled' : '') + '>' + esc(o.t) + '</button>';
  }).join('') + '</div>';
}
function quizHTML() {
  const q = S.q, it = q.it, done = S.answered !== null;
  const ok = done && q.opts[S.answered].ok;
  let top, body, fb = '';
  if (S.mode === 'verb') {
    top = it.kind === 'v' ? 'Verbo' : 'Preposición';
    body = '<p class="vword">' + esc(it.w) + '</p><p class="prompt t-body-l">' + esc(it.g) + '</p>' +
      '<p class="prompt t-body-l">' + (it.kind === 'v' ? '¿Qué caso pide la persona u objeto que acompaña a este verbo?' : '¿Qué caso pide esta preposición?') + '</p>' + picksHTML(q, done);
    if (done) {
      fb = '<div class="md-card fbk ' + (ok ? 'c-success' : 'c-error') + '" role="status">' +
        '<h3>' + ic(ok ? 'check_circle' : 'cancel', true) + (ok ? '¡Richtig!' : 'Todavía no') + '</h3>' +
        '<p class="t-body-m"><b>' + esc(it.w) + '</b> → ' + (it.c === 'wech' ? '<b>depende</b>: ¿wo? → Dativ, ¿wohin? → Akkusativ' : '<b>' + CASES[it.c].name + '</b>') + '</p>' +
        '<p class="t-body-m">' + esc(it.ex) + ' <span style="opacity:.8">— ' + esc(it.exEs) + '</span></p>' +
        (it.ex2 ? '<p class="t-body-m">' + esc(it.ex2) + ' <span style="opacity:.8">— ' + esc(it.ex2Es) + '</span></p>' : '') +
        (it.note ? '<p class="t-body-m">' + esc(it.note) + '</p>' : '') +
        '<div class="md-row" style="margin-top:4px"><button class="md-btn filled" data-act="next" id="nextbtn">Siguiente</button>' + speakBtn(it.ex2 ? it.ex + ' ' + it.ex2 : it.ex) + '</div></div>';
    }
  } else if (S.mode === 'art') {
    top = 'Artículos';
    body = '<p class="sentence">' + sentArt(it, done) + '</p><p class="t-body-l muted center">' + esc(it.es) + '</p>' +
      '<p class="prompt t-body-l">¿Qué artículo va en el hueco?</p>' + picksHTML(q, done);
    if (done) {
      const f = AF[it.t][it.g];
      fb = '<div class="md-card fbk ' + (ok ? 'c-success' : 'c-error') + '" role="status">' +
        '<h3>' + ic(ok ? 'check_circle' : 'cancel', true) + (ok ? '¡Richtig!' : 'Todavía no') + '</h3>' +
        '<p class="t-body-m">' + badge(it.c) + ' ' + esc(CASES[it.c].q) + '</p>' +
        '<p class="t-body-m">' + esc(it.why) + '</p>' +
        '<p class="t-body-m"><b>' + GDEF[it.g] + ' ' + esc(it.noun) + '</b> · ' + GL[it.g] + '</p>' +
        '<p class="t-body-m">Nominativ <b>' + f[0] + '</b> · Akkusativ <b>' + f[1] + '</b> · Dativ <b>' + f[2] + '</b></p>' +
        '<div class="md-row" style="margin-top:4px"><button class="md-btn filled" data-act="next" id="nextbtn">Siguiente</button>' + speakBtn(fullArt(it)) + '</div></div>';
    }
  } else {
    top = S.mode === 'fill' ? 'Completar' : '¿Qué caso?';
    const state = S.mode === 'fill' ? (done ? 2 : 0) : (done ? 2 : 1);
    body = '<p class="sentence">' + sentHTML(it, state) + '</p><p class="t-body-l muted center">' + esc(it.es) + '</p>' +
      '<p class="prompt t-body-l">' + (S.mode === 'fill' ? '¿Qué pronombre va en el hueco?' : '¿En qué caso está el pronombre?') + '</p>' + picksHTML(q, done);
    if (done) {
      const pr = P[it.p];
      fb = '<div class="md-card fbk ' + (ok ? 'c-success' : 'c-error') + '" role="status">' +
        '<h3>' + ic(ok ? 'check_circle' : 'cancel', true) + (ok ? '¡Richtig!' : 'Todavía no') + '</h3>' +
        '<p class="t-body-m">' + badge(it.c) + ' ' + esc(CASES[it.c].q) + '</p>' +
        '<p class="t-body-m">' + esc(it.why) + '</p>' +
        '<p class="t-body-m">' + esc(pr.lab) + ' → <b>' + esc(pr.akk) + '</b> (Akkusativ) · <b>' + esc(pr.dat) + '</b> (Dativ)</p>' +
        '<div class="md-row" style="margin-top:4px"><button class="md-btn filled" data-act="next" id="nextbtn">Siguiente</button>' + speakBtn(fullSentence(it)) + '</div></div>';
    }
  }
  return '<div class="md-card elevated quiz"><div class="qtop"><span class="md-chip static">' + top + '</span>' +
    (q.retry ? '<span class="md-chip static accent">Repaso de un fallo</span>' : '') + '</div>' + body + fb + '</div>';
}
function practiceHTML() {
  const seg = '<div class="ctl"><span class="t-label-m">Ejercicio</span><div class="md-chips" role="group" aria-label="Tipo de ejercicio">' +
    MODES.map(function (m) { return chip(m[1], S.mode === m[0], 'data-mode="' + m[0] + '"'); }).join('') + '</div></div>';
  const fl = S.mode === 'art' ? FILTERS_ART : FILTERS;
  const filters = S.mode === 'verb' ? '' :
    '<div class="ctl"><span class="t-label-m">' + (S.mode === 'art' ? 'Caso' : 'Tipo de frase') + '</span><div class="md-chips" role="group" aria-label="Filtro">' + fl.map(function (f) { return chip(f[1], S.filter === f[0], 'data-filter="' + f[0] + '"'); }).join('') + '</div></div>';
  const stats = '<div class="stats"><div class="md-card stat"><span class="t-label-m">Racha</span><b>' + S.streak + '</b></div>' +
    '<div class="md-card stat"><span class="t-label-m">Mejor racha</span><b>' + S.best + '</b></div>' +
    '<div class="md-card stat"><span class="t-label-m">Aciertos</span><b>' + S.correct + '/' + S.total + '</b></div></div>';
  return seg + filters + stats + '<div id="quiz">' + quizHTML() + '</div>';
}
function renderPractice() {
  const quiz = document.getElementById('quiz');
  if (!quiz) { view.innerHTML = practiceHTML(); }
  else {
    view.innerHTML = practiceHTML();
  }
  if (S.answered !== null) { const b = document.getElementById('nextbtn'); if (b) b.focus({preventScroll:true}); }
}

/* ---------- Navegación y eventos ---------- */
function setTab(t) {
  S.tab = t;
  document.querySelectorAll('.md-nav-item').forEach(function (b) {
    const on = b.dataset.tab === t; b.setAttribute('aria-selected', on ? 'true' : 'false'); b.tabIndex = on ? 0 : -1;
  });
  if (t === 'study') view.innerHTML = studyHTML();
  else if (t === 'lists') view.innerHTML = listsHTML();
  else { if (!S.q) newQuestion(); renderPractice(); }
}
document.querySelector('.md-nav').addEventListener('click', function (e) {
  const b = e.target.closest('.md-nav-item'); if (b) { setTab(b.dataset.tab); window.scrollTo(0, 0); }
});
view.addEventListener('click', function (e) {
  const say = e.target.closest('[data-say]');
  if (say) { speak(say.dataset.say); return; }
  const pe = e.target.closest('[data-person]');
  if (pe) { S.person = pe.dataset.person; view.innerHTML = studyHTML(); return; }
  const ar = e.target.closest('[data-art]');
  if (ar) { S.art = ar.dataset.art; view.innerHTML = studyHTML(); return; }
  const ls = e.target.closest('[data-list]');
  if (ls) { S.list = ls.dataset.list; view.innerHTML = listsHTML(); return; }
  const md = e.target.closest('[data-mode]');
  if (md) { S.mode = md.dataset.mode; S.filter = 'all'; resetSession(); newQuestion(); renderPractice(); return; }
  const fl = e.target.closest('[data-filter]');
  if (fl) { S.filter = fl.dataset.filter; resetSession(); newQuestion(); renderPractice(); return; }
  const op = e.target.closest('[data-opt]');
  if (op) { answer(parseInt(op.dataset.opt, 10)); return; }
  const nx = e.target.closest('[data-act="next"]');
  if (nx) nextQ();
});
document.addEventListener('keydown', function (e) {
  if (S.tab !== 'practice' || e.metaKey || e.ctrlKey || e.altKey || !S.q) return;
  if (S.answered === null && ['1', '2', '3'].indexOf(e.key) >= 0) answer(parseInt(e.key, 10) - 1);
  else if (S.answered !== null && (e.key === 'n' || (e.key === 'Enter' && !(e.target && e.target.closest && e.target.closest('button'))))) { e.preventDefault(); nextQ(); }
});
if (hasSpeech) { try { speechSynthesis.getVoices(); } catch (e) {} }
setTab('study');
})();
</script>

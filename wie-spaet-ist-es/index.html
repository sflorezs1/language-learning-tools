<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F9FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<title>Wie spät ist es?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="../material.css">
<style>
/* Layout: una columna en teléfono; en pantallas anchas el reloj queda fijo a la izquierda y las dos lecturas a la derecha. */
:root{--face:var(--md-surface-container-high);--hand:var(--md-on-surface);--dial:var(--md-primary)}
.lead{margin:8px 0 16px;max-width:60ch}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl>.t-label-m{color:var(--md-on-surface-variant);text-transform:uppercase}

/* Estudiar */
.study{display:grid;gap:16px}
@media (min-width:880px){
  .study{grid-template-columns:minmax(320px,400px) minmax(0,1fr);align-items:start}
  .clockbox{position:sticky;top:80px}
}
.clockbox{display:flex;flex-direction:column;gap:16px}
.clockwrap{width:100%;max-width:340px;margin:0 auto;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.clockwrap svg{display:block;width:100%;height:auto}
.digital{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.dig{font:400 56px/64px var(--md-font);letter-spacing:0;font-variant-numeric:tabular-nums}
.controls{display:flex;flex-direction:column;gap:16px}
.readout{display:flex;flex-direction:column;gap:16px;min-width:0}
.rd{display:flex;flex-direction:column;gap:12px}
.rd-head{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.sent{font:400 28px/36px var(--md-font);letter-spacing:0;overflow-wrap:anywhere}
.sent b{font-weight:500;color:var(--md-primary)}
.pat{display:flex;gap:8px;flex-wrap:wrap}
.pc{display:flex;flex-direction:column;padding:8px 12px;border:1px solid var(--md-outline-variant);border-radius:8px}
.pc b{font:500 16px/24px var(--md-font);letter-spacing:.15px}
.pc i{font:400 12px/16px var(--md-font);font-style:normal;color:var(--md-on-surface-variant)}
.alts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.alts b{font-weight:500}
.alts small{margin-left:8px;color:var(--md-on-surface-variant);font-size:13px}

/* Reloj */
.c-face{fill:var(--face);stroke:var(--md-outline);stroke-width:3}
.c-tick{stroke:var(--md-on-surface-variant);stroke-linecap:butt}
.c-num{fill:var(--md-on-surface);font:500 15px var(--md-font);text-anchor:middle;dominant-baseline:central}
.c-num.ref{fill:var(--md-on-primary)}
.c-ref{fill:var(--dial)}
.c-arc{fill:none;stroke:var(--dial);stroke-width:5;opacity:.45}
.c-lab{fill:var(--md-on-surface-variant);opacity:.7;font:500 9px var(--md-font);text-anchor:middle;dominant-baseline:central;letter-spacing:.06em}
.c-lab.on{fill:var(--dial);opacity:1}
.c-hand{fill:var(--hand)}
.c-hub{fill:var(--hand)}
.c-dot{fill:var(--dial)}

/* Practicar */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{display:flex;flex-direction:column;padding:12px 16px}
.stat .t-label-m{color:var(--md-on-surface-variant)}
.stat b{font:400 24px/32px var(--md-font);font-variant-numeric:tabular-nums}
.quiz{display:flex;flex-direction:column;gap:16px}
.qtop{display:flex;gap:8px;flex-wrap:wrap}
.qclock{width:100%;max-width:260px;margin:0 auto}
.qclock svg{display:block;width:100%;height:auto}
.qprompt{text-align:center}
.qphrase{text-align:center;font:400 32px/40px var(--md-font);letter-spacing:0;overflow-wrap:anywhere}
.opts{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.opts{grid-template-columns:1fr 1fr}}
.opts.clocks{grid-template-columns:1fr 1fr}
.opt,.optc{position:relative;overflow:hidden;border:1px solid var(--md-outline);border-radius:12px;background:transparent;color:var(--md-on-surface);cursor:pointer;min-width:0;text-align:left;-webkit-tap-highlight-color:transparent}
.opt::before,.optc::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.opt:hover:not(:disabled)::before,.optc:hover:not(:disabled)::before{opacity:.08}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px 8px 12px;font:500 16px/24px var(--md-font);letter-spacing:.15px}
.opt .k{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:var(--md-surface-container-highest);color:var(--md-on-surface-variant);font:500 13px/16px var(--md-font)}
.opt .t{flex:1;min-width:0;overflow-wrap:anywhere}
.optc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;text-align:center}
.optc svg{display:block;width:100%;max-width:150px;height:auto}
.optc .cap{min-height:24px;font:500 16px/24px var(--md-font);font-variant-numeric:tabular-nums}
.opt:disabled,.optc:disabled{cursor:default;color:var(--md-on-surface)}
.opt.ok,.optc.ok{border-color:transparent;background:var(--md-success-container);color:var(--md-on-success-container)}
.opt.bad,.optc.bad{border-color:transparent;background:var(--md-error-container);color:var(--md-on-error-container)}
.opt.ok .k,.opt.bad .k{background:transparent;color:inherit}
.fbk{display:flex;flex-direction:column;gap:8px}
.fbk h3{font:500 16px/24px var(--md-font);letter-spacing:.15px}
.settings{display:flex;flex-direction:column;gap:16px;margin-top:16px}

/* Tabla */
.rules3{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));margin-bottom:16px}
.rules3 .md-card{padding:12px 16px}
.rules3 b{display:block;font:500 20px/28px var(--md-font);letter-spacing:0}
.hourbar{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.hourbar .big{min-width:5rem;text-align:center;font:400 28px/36px var(--md-font);letter-spacing:0;font-variant-numeric:tabular-nums}
.trows{overflow:hidden;padding:0}
.trow .td{flex:none;min-width:4.4rem;font:400 22px/28px var(--md-font);letter-spacing:0;font-variant-numeric:tabular-nums}
.trow .md-body{display:flex;flex-direction:column;gap:2px}
.trow .lb{display:inline-block;min-width:5.2rem;color:var(--md-on-surface-variant);font:500 12px/16px var(--md-font);letter-spacing:.5px;text-transform:uppercase}
.trow .v{font:400 16px/24px var(--md-font);overflow-wrap:anywhere}
.trow .alt{display:block;margin-left:5.2rem;color:var(--md-on-surface-variant);font-size:13px;line-height:18px}
</style>
</head>
<body>

<header class="md-top">
  <div class="md-top-in has-action">
    <a class="md-icon-btn" href="../" aria-label="Todas las herramientas"><span class="md-icon" aria-hidden="true">arrow_back</span></a>
    <h1>Wie spät ist es?</h1>
    <a class="md-icon-btn" href="../atribuciones/" aria-label="Atribuciones" title="Atribuciones"><span class="md-icon" aria-hidden="true">info</span></a>
  </div>
</header>

<main class="md-main">
  <p class="t-body-l muted lead">La hora en alemán: lectura formal (24 h) y lectura coloquial (halb, Viertel, vor, nach).</p>
  <section id="view" role="tabpanel"></section>
</main>

<nav class="md-nav" role="tablist" aria-label="Secciones">
  <div class="md-nav-in">
    <button class="md-nav-item" role="tab" data-tab="study" aria-selected="true"><span class="md-nav-ind"><span class="md-icon" aria-hidden="true">school</span></span><span>Estudiar</span></button>
    <button class="md-nav-item" role="tab" data-tab="practice" aria-selected="false"><span class="md-nav-ind"><span class="md-icon" aria-hidden="true">quiz</span></span><span>Practicar</span></button>
    <button class="md-nav-item" role="tab" data-tab="table" aria-selected="false"><span class="md-nav-ind"><span class="md-icon" aria-hidden="true">table_rows</span></span><span>Tabla</span></button>
  </div>
</nav>
<div class="md-snack" id="toast" role="status" aria-live="polite"></div>

<script>
/*LOGIC*/
const UNITS=['null','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf','dreizehn','vierzehn','fünfzehn','sechzehn','siebzehn','achtzehn','neunzehn'];
const TENS={20:'zwanzig',30:'dreißig',40:'vierzig',50:'fünfzig'};
function num(n,o){
  const ein=!!(o&&o.ein);
  if(n<20){ return (n===1&&ein)?'ein':UNITS[n]; }
  const t=Math.floor(n/10)*10,u=n%10;
  if(u===0) return TENS[t];
  return (u===1?'ein':UNITS[u])+'und'+TENS[t];
}
function pad(n){return String(n).padStart(2,'0');}
function formal(h,m){
  const hs=num(h,{ein:true})+' Uhr';
  return m===0?hs:hs+' '+num(m);
}
function formalWhy(h,m){
  let t='En la lectura formal no existen halb, Viertel, vor ni nach: solo hora (0–23) + Uhr + minutos.';
  if(h===0) t+=' A medianoche se dice «null Uhr».';
  else if(h===12) t+=' «zwölf Uhr» es el mediodía.';
  else if(h>12) t+=' '+h+' h son las '+(h-12)+' del reloj de 12 horas ('+h+' − 12).';
  if(h===1||h===21) t+=' Delante de «Uhr» se dice «ein», no «eins».';
  if(m===1) t+=' El minuto 1 se dice «eins».';
  return t;
}
function colloq(h,m){
  const H=(h%12)||12, N=((h+1)%12)||12;
  const hw=n=>n===1?'eins':num(n);
  const cnt=c=>c===1?'eine Minute':num(c);
  const alts=[]; let main,ref,kind,why;
  if(m===0){
    main=(H===1?'ein':num(H))+' Uhr'; ref=H; kind='punkt';
    if(h===0) alts.push({text:'Mitternacht',note:'medianoche'});
    if(h===12) alts.push({text:'Mittag',note:'mediodía'});
    why='En punto: el número de la hora + «Uhr». La una es «ein Uhr», sin la «s» de «eins».';
  } else if(m===15){
    main='Viertel nach '+hw(H); ref=H; kind='viertelnach';
    alts.push({text:'Viertel '+hw(N),note:'regional: sur y este de Alemania'});
    why='«Viertel nach» = y cuarto. Se apoya en la hora que acaba de pasar ('+H+').';
  } else if(m<25){
    main=cnt(m)+' nach '+hw(H); ref=H; kind='nach';
    if(m===20) alts.push({text:'zehn vor halb '+hw(N),note:'también frecuente'});
    why='Hasta el minuto 24 se cuenta desde la hora que acaba de pasar: minutos + «nach» + esa hora ('+H+').';
  } else if(m<30){
    main=cnt(30-m)+' vor halb '+hw(N); ref=N; kind='vorhalb';
    if(m===25) alts.push({text:'fünfundzwanzig nach '+hw(H),note:'menos usual'});
    why='Faltan '+(30-m)+' min para la media hora: «vor halb» + la hora SIGUIENTE ('+N+'). «halb» siempre mira a la hora que viene.';
  } else if(m===30){
    main='halb '+hw(N); ref=N; kind='halb';
    why='«halb» mira hacia la hora siguiente: '+H+':30 es «halb '+hw(N)+'» (media hora antes de las '+N+'), no «halb '+hw(H)+'».';
  } else if(m<=35){
    main=cnt(m-30)+' nach halb '+hw(N); ref=N; kind='nachhalb';
    if(m===35) alts.push({text:'fünfundzwanzig vor '+hw(N),note:'menos usual'});
    why='Pasaron '+(m-30)+' min de la media: «nach halb» + la hora SIGUIENTE ('+N+').';
  } else if(m===45){
    main='Viertel vor '+hw(N); ref=N; kind='viertelvor';
    alts.push({text:'dreiviertel '+hw(N),note:'regional: sur y este de Alemania'});
    why='«Viertel vor» = menos cuarto. Se apoya en la hora siguiente ('+N+').';
  } else {
    main=cnt(60-m)+' vor '+hw(N); ref=N; kind='vor';
    if(m===40) alts.push({text:'zehn nach halb '+hw(N),note:'también frecuente'});
    why='Desde el minuto 36 se cuenta hacia la hora siguiente: minutos que faltan + «vor» + '+N+'.';
  }
  return {main:main,alts:alts,ref:ref,kind:kind,why:why};
}
function daypart(h){
  if(h<5) return ['nachts','noche'];
  if(h<9) return ['morgens','mañana'];
  if(h<12) return ['vormittags','media mañana'];
  if(h<14) return ['mittags','mediodía'];
  if(h<18) return ['nachmittags','tarde'];
  if(h<22) return ['abends','tarde-noche'];
  return ['nachts','noche'];
}
function allowedMinutes(level){
  if(level===1) return [0,30];
  if(level===2) return [0,15,30,45];
  const a=[]; for(let i=0;i<60;i+=5) a.push(i); return a;
}
/*END-LOGIC*/

(function(){
'use strict';
const view=document.getElementById('view');
const store={
  get:function(){try{return JSON.parse(localStorage.getItem('wse.v1'))||{};}catch(e){return {};}},
  set:function(o){try{localStorage.setItem('wse.v1',JSON.stringify(o));}catch(e){}}
};
const saved=store.get();
const ALLT=['colloq','formal','clock'];
const S={
  tab:'study',
  study:{h:14,m:30,step:5,help:true},
  tableH:7,
  level:[1,2,3].indexOf(saved.level)>=0?saved.level:3,
  types:(Array.isArray(saved.types)?saved.types.filter(function(t){return ALLT.indexOf(t)>=0;}):[]),
  best:saved.best|0,
  streak:0,total:0,correct:0,
  q:null,answered:null,queue:[],prev:null
};
if(!S.types.length) S.types=ALLT.slice();
function persist(){store.set({level:S.level,types:S.types,best:S.best});}
const esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
const pick=function(a){return a[Math.floor(Math.random()*a.length)];};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const norm=function(T){return ((T%1440)+1440)%1440;};
const hasSpeech='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
const ic=function(name,fill){return '<span class="md-icon'+(fill?' fill':'')+'" aria-hidden="true">'+name+'</span>';};
const chip=function(label,pressed,attrs){return '<button class="md-chip" aria-pressed="'+pressed+'" '+attrs+'>'+ic('check')+label+'</button>';};

/* ---------- Dial ---------- */
function pt(deg,r){const a=deg*Math.PI/180;return [100+r*Math.sin(a),100-r*Math.cos(a)];}
function f2(n){return n.toFixed(2);}
function clockSVG(h,m,o){
  o=o||{};
  const annot=!!o.annot, c=o.c||colloq(h,m);
  let s='<svg viewBox="0 0 200 200" role="img" aria-label="Reloj analógico: '+((h%12)||12)+':'+pad(m)+'" xmlns="http://www.w3.org/2000/svg">';
  s+='<circle class="c-face" cx="100" cy="100" r="97"/>';
  for(let i=0;i<60;i++){
    const big=i%5===0, p0=pt(i*6,big?77:85), p1=pt(i*6,91);
    s+='<line class="c-tick" x1="'+f2(p0[0])+'" y1="'+f2(p0[1])+'" x2="'+f2(p1[0])+'" y2="'+f2(p1[1])+'" stroke-width="'+(big?4:1.4)+'"/>';
  }
  if(annot&&m>0){
    const a0=m<=30?0:m*6, a1=m<=30?m*6:360;
    const p0=pt(a0,52), p1=pt(a1,52);
    s+='<path class="c-arc" d="M'+f2(p0[0])+' '+f2(p0[1])+' A52 52 0 '+((a1-a0)>180?1:0)+' 1 '+f2(p1[0])+' '+f2(p1[1])+'"/>';
    const lp=pt(62,36), lv=pt(298,36), lh=pt(180,36);
    s+='<text class="c-lab'+(m<=30?' on':'')+'" x="'+f2(lp[0])+'" y="'+f2(lp[1])+'">nach</text>';
    s+='<text class="c-lab'+(m>30?' on':'')+'" x="'+f2(lv[0])+'" y="'+f2(lv[1])+'">vor</text>';
    s+='<text class="c-lab'+(m===30?' on':'')+'" x="'+f2(lh[0])+'" y="'+f2(lh[1])+'">halb</text>';
  }
  for(let n=1;n<=12;n++){
    const p=pt(n*30,66), isRef=annot&&c.ref===n;
    if(isRef) s+='<circle class="c-ref" cx="'+f2(p[0])+'" cy="'+f2(p[1])+'" r="11"/>';
    s+='<text class="c-num'+(isRef?' ref':'')+'" x="'+f2(p[0])+'" y="'+f2(p[1])+'">'+n+'</text>';
  }
  const ha=(h%12)*30+m*0.5, ma=m*6;
  s+='<g transform="rotate('+ha+' 100 100)"><rect class="c-hand" x="96" y="48" width="8" height="64"/></g>';
  s+='<g transform="rotate('+ma+' 100 100)"><rect class="c-hand" x="97.5" y="14" width="5" height="98"/></g>';
  s+='<circle class="c-hub" cx="100" cy="100" r="6"/><circle class="c-dot" cx="100" cy="100" r="3"/>';
  return s+'</svg>';
}

/* ---------- Voz ---------- */
let toastT=null;
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2800);
}
function speak(text){
  try{
    if(!hasSpeech){toast('Este navegador no tiene voz sintética.');return;}
    const voices=speechSynthesis.getVoices()||[];
    const v=voices.find(function(x){return x.lang&&x.lang.toLowerCase().indexOf('de')===0;});
    if(voices.length&&!v){toast('No hay una voz en alemán instalada en este dispositivo.');return;}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=0.85;if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){toast('No se pudo reproducir el audio.');}
}
function speakBtn(text){
  return hasSpeech?'<button class="md-btn tonal has-icon" data-say="'+esc(text)+'">'+ic('volume_up')+'Escuchar</button>':'';
}

/* ---------- Estudiar ---------- */
function studyHTML(){
  return '<div class="study">'+
  '<div class="md-card elevated clockbox">'+
    '<div class="clockwrap" id="clockwrap"></div>'+
    '<div class="digital"><span class="dig" id="dig"></span><span class="md-chip static" id="dp"></span></div>'+
    '<p class="t-body-s muted" style="text-align:center">Arrastra sobre el reloj para mover los minutos.</p>'+
    '<div class="controls">'+
      '<div class="ctl"><span class="t-label-m">Hora</span><div class="md-row">'+
        '<button class="md-btn outlined has-icon" data-act="h-">'+ic('remove')+'1 h</button>'+
        '<button class="md-btn outlined has-icon" data-act="h+">'+ic('add')+'1 h</button></div></div>'+
      '<div class="ctl"><span class="t-label-m">Minutos</span><div class="md-row">'+
        '<button class="md-btn outlined has-icon" data-act="m-">'+ic('remove')+'<span id="mminus"></span></button>'+
        '<button class="md-btn outlined has-icon" data-act="m+">'+ic('add')+'<span id="mplus"></span></button></div></div>'+
      '<div class="md-row">'+
        '<button class="md-btn tonal has-icon" data-act="ampm">'+ic('swap_vert')+'Mañana / tarde</button>'+
        '<button class="md-btn tonal has-icon" data-act="rand">'+ic('shuffle')+'Al azar</button>'+
        '<button class="md-btn tonal has-icon" data-act="now">'+ic('schedule')+'Hora actual</button></div>'+
      '<div class="md-seg" role="group" aria-label="Paso de minutos"><button id="b5" data-act="step5" aria-pressed="true">'+ic('check')+'De 5 en 5</button><button id="b1" data-act="step1" aria-pressed="false">'+ic('check')+'Minuto exacto</button></div>'+
      '<label class="md-switch"><input type="checkbox" id="bh" role="switch" data-act="help" checked><span class="track"><span class="thumb"></span></span><span class="t-body-l">Ayudas en el reloj</span></label>'+
    '</div>'+
  '</div>'+
  '<div class="readout" id="readout"></div>'+
  '</div>';
}
function readoutHTML(h,m,c){
  const f=formal(h,m), dp=daypart(h);
  const pat='<span class="pc"><b>'+esc(num(h,{ein:true}))+'</b><i>hora (0–23)</i></span>'+
    '<span class="pc"><b>Uhr</b><i>fijo</i></span>'+
    (m>0?'<span class="pc"><b>'+esc(num(m))+'</b><i>minutos</i></span>':'');
  let alts='';
  if(c.alts.length){
    alts='<p class="t-label-m muted">También se dice</p><ul class="alts t-body-l">'+c.alts.map(function(a){
      return '<li><b>'+esc(a.text)+'</b><small>'+esc(a.note)+'</small></li>';}).join('')+'</ul>';
  }
  return '<article class="md-card elevated rd">'+
    '<header class="rd-head"><h2 class="t-title-l">Lectura formal</h2><span class="md-chip static">24 h · horarios, radio, citas</span></header>'+
    '<p class="sent">Es ist <b>'+esc(f)+'</b>.</p>'+
    '<div class="pat">'+pat+'</div>'+
    '<p class="t-body-m muted">'+esc(formalWhy(h,m))+' '+esc(dp[0])+' = '+esc(dp[1])+'.</p>'+
    '<div class="md-row">'+speakBtn('Es ist '+f)+'</div>'+
  '</article>'+
  '<article class="md-card elevated rd">'+
    '<header class="rd-head"><h2 class="t-title-l">Lectura coloquial</h2><span class="md-chip static">12 h · conversación diaria</span></header>'+
    '<p class="sent">Es ist <b>'+esc(c.main)+'</b>.</p>'+
    alts+
    '<p class="t-body-m muted">'+esc(c.why)+'</p>'+
    '<div class="md-row">'+speakBtn('Es ist '+c.main)+'</div>'+
  '</article>';
}
function updateStudy(){
  const st=S.study, h=st.h, m=st.m, c=colloq(h,m), dp=daypart(h);
  document.getElementById('clockwrap').innerHTML=clockSVG(h,m,{annot:st.help,c:c});
  document.getElementById('dig').textContent=pad(h)+':'+pad(m);
  document.getElementById('dp').textContent=dp[0]+' · '+dp[1];
  document.getElementById('readout').innerHTML=readoutHTML(h,m,c);
  document.getElementById('mminus').textContent=st.step+' min';
  document.getElementById('mplus').textContent=st.step+' min';
  document.getElementById('b5').setAttribute('aria-pressed',st.step===5);
  document.getElementById('b1').setAttribute('aria-pressed',st.step===1);
  document.getElementById('bh').checked=st.help;
}
function snap5(){
  const st=S.study;
  let m=Math.round(st.m/5)*5;
  if(m===60){m=0;st.h=(st.h+1)%24;}
  st.m=m;
}
function bindDrag(){
  const w=document.getElementById('clockwrap');
  let drag=false;
  function setFrom(ev,first){
    const svg=w.querySelector('svg'); if(!svg) return;
    const r=svg.getBoundingClientRect();
    const dx=ev.clientX-(r.left+r.width/2), dy=ev.clientY-(r.top+r.height/2);
    if(Math.hypot(dx,dy)<r.width*0.1) return;
    let a=Math.atan2(dx,-dy)*180/Math.PI; if(a<0) a+=360;
    const st=S.study;
    const nm=st.step===5?(Math.round(a/30)*5)%60:Math.round(a/6)%60;
    const prev=st.m;
    if(nm===prev) return;
    if(!first){
      if(prev>=45&&nm<=15) st.h=(st.h+1)%24;
      else if(prev<=15&&nm>=45) st.h=(st.h+23)%24;
    }
    st.m=nm; updateStudy();
  }
  w.addEventListener('pointerdown',function(ev){drag=true;try{w.setPointerCapture(ev.pointerId);}catch(e){}setFrom(ev,true);});
  w.addEventListener('pointermove',function(ev){if(drag) setFrom(ev,false);});
  const end=function(){drag=false;};
  w.addEventListener('pointerup',end);w.addEventListener('pointercancel',end);
}

/* ---------- Tabla ---------- */
function tableHTML(){
  const h=S.tableH, dp=daypart(h);
  let rows='';
  for(let m=0;m<60;m+=5){
    const c=colloq(h,m);
    const alt=c.alts.length?'<span class="alt">también: '+c.alts.map(function(a){return esc(a.text);}).join(' · ')+'</span>':'';
    rows+='<li><button class="md-list-item trow" data-act="load" data-h="'+h+'" data-m="'+m+'">'+
      '<span class="td">'+pad(h)+':'+pad(m)+'</span>'+
      '<span class="md-body">'+
        '<span><span class="lb">Formal</span><span class="v">'+esc(formal(h,m))+'</span></span>'+
        '<span><span class="lb">Coloquial</span><span class="v">'+esc(c.main)+'</span>'+alt+'</span>'+
      '</span>'+ic('chevron_right').replace('md-icon','md-icon trail')+
    '</button></li>';
  }
  return '<div class="rules3">'+
    '<div class="md-card filled"><b>:01 – :24</b><span class="t-body-m muted">minutos + <em>nach</em> + hora actual</span></div>'+
    '<div class="md-card filled"><b>:25 – :35</b><span class="t-body-m muted"><em>halb</em> como referencia, con la hora siguiente</span></div>'+
    '<div class="md-card filled"><b>:36 – :59</b><span class="t-body-m muted">minutos que faltan + <em>vor</em> + hora siguiente</span></div>'+
  '</div>'+
  '<div class="hourbar"><button class="md-icon-btn" data-act="th-" aria-label="Hora anterior">'+ic('chevron_left')+'</button><span class="big">'+pad(h)+' h</span><button class="md-icon-btn" data-act="th+" aria-label="Hora siguiente">'+ic('chevron_right')+'</button><span class="md-chip static">'+esc(dp[0])+' · '+esc(dp[1])+'</span></div>'+
  '<p class="t-body-s muted" style="margin-bottom:8px">Toca una fila para verla en el reloj.</p>'+
  '<ul class="md-list md-card outlined trows">'+rows+'</ul>';
}

/* ---------- Practicar ---------- */
function keyOf(mode,h,m){
  if(mode==='colloq') return colloq(h,m).main;
  if(mode==='formal') return formal(h,m);
  return ((h%12)||12)+':'+m;
}
function makeOptions(mode,h,m){
  const T=h*60+m, mins=allowedMinutes(S.level).concat([m]);
  const seen={}; seen[keyOf(mode,h,m)]=1;
  const out=[], pool=[];
  [-60,-30,-15,-10,-5,5,10,15,30,60].forEach(function(d){pool.push(norm(T+d));});
  pool.push(norm(h*60+((60-m)%60)));
  shuffle(pool);
  const order=(mode==='formal'?[norm(T+720)]:[]).concat(pool);
  order.forEach(function(t){
    if(out.length>=3) return;
    const mm=t%60, hh=Math.floor(t/60);
    if(mins.indexOf(mm)<0) return;
    const k=keyOf(mode,hh,mm);
    if(seen[k]) return; seen[k]=1; out.push({h:hh,m:mm});
  });
  let guard=0;
  while(out.length<3&&guard++<200){
    const hh=Math.floor(Math.random()*24), mm=pick(allowedMinutes(S.level)), k=keyOf(mode,hh,mm);
    if(seen[k]) continue; seen[k]=1; out.push({h:hh,m:mm});
  }
  const opts=out.map(function(x){return {h:x.h,m:x.m,correct:false};});
  opts.push({h:h,m:m,correct:true});
  return shuffle(opts);
}
function newQuestion(){
  S.queue.forEach(function(r){r.wait--;});
  const r=S.queue.find(function(x){return x.wait<=0;});
  let type,pk,h,m,retry=false;
  if(r){
    S.queue.splice(S.queue.indexOf(r),1);
    type=r.type;pk=r.pk;h=r.h;m=r.m;retry=true;
  } else {
    type=pick(S.types);
    const mins=allowedMinutes(S.level);
    let g=0;
    do{h=Math.floor(Math.random()*24);m=pick(mins);g++;}while(S.prev&&S.prev.h===h&&S.prev.m===m&&g<50);
    pk=type==='clock'?pick(['colloq','formal']):type;
  }
  const mode=type==='clock'?'clock':type;
  S.q={type:type,pk:pk,h:h,m:m,retry:retry,options:makeOptions(mode,h,m)};
  S.answered=null;
}
const TLAB={colloq:'Reloj → coloquial',formal:'Reloj → formal',clock:'Frase → reloj'};
const LVL=[null,'Horas y medias','Con cuartos','Cada 5 min'];
function quizHTML(){
  const q=S.q, done=S.answered!==null, c=colloq(q.h,q.m), f=formal(q.h,q.m), dp=daypart(q.h);
  let body='';
  if(q.type==='clock'){
    const phrase=q.pk==='colloq'?'Es ist '+c.main:'Es ist '+f;
    body+='<p class="qphrase">'+esc(phrase)+'</p><p class="qprompt t-body-l muted">¿Qué reloj muestra esta hora?</p>';
    body+='<div class="opts clocks">'+q.options.map(function(o,i){
      const cls=done?(o.correct?' ok':(S.answered===i?' bad':'')):'';
      const cap=done?(((o.h%12)||12)+':'+pad(o.m)):'&nbsp;';
      return '<button class="optc'+cls+'" data-opt="'+i+'"'+(done?' disabled':'')+' aria-label="Reloj '+(i+1)+'">'+
        clockSVG(o.h,o.m,{})+'<span class="cap">'+cap+'</span></button>';
    }).join('')+'</div>';
  } else {
    body+='<div class="qclock">'+clockSVG(q.h,q.m,{})+'</div>';
    body+='<div class="md-row" style="justify-content:center"><span class="md-chip static">'+esc(dp[0])+' · '+esc(dp[1])+'</span></div>';
    body+='<p class="qprompt t-body-l muted">'+(q.type==='colloq'?'¿Cómo se dice en lenguaje coloquial?':'¿Cómo se lee en formal (24 h)?')+'</p>';
    body+='<div class="opts">'+q.options.map(function(o,i){
      const txt=q.type==='colloq'?colloq(o.h,o.m).main:formal(o.h,o.m);
      const cls=done?(o.correct?' ok':(S.answered===i?' bad':'')):'';
      const mk=done?(o.correct?ic('check_circle',true):(S.answered===i?ic('cancel',true):'')):'';
      return '<button class="opt'+cls+'" data-opt="'+i+'"'+(done?' disabled':'')+'><span class="k">'+(i+1)+'</span><span class="t">'+esc(txt)+'</span>'+mk+'</button>';
    }).join('')+'</div>';
  }
  let fb='';
  if(done){
    const ok=q.options[S.answered].correct;
    const why=(q.pk==='formal')?formalWhy(q.h,q.m):c.why;
    fb='<div class="md-card fbk '+(ok?'c-success':'c-error')+'" role="status">'+
      '<h3>'+(ok?'¡Richtig!':'Todavía no')+' · '+pad(q.h)+':'+pad(q.m)+'</h3>'+
      '<p class="t-body-m">Formal: <b>Es ist '+esc(f)+'</b></p>'+
      '<p class="t-body-m">Coloquial: <b>Es ist '+esc(c.main)+'</b></p>'+
      '<p class="t-body-m">'+esc(why)+'</p>'+
      '<div class="md-row" style="margin-top:4px"><button class="md-btn filled" data-act="next" id="nextbtn">Siguiente</button>'+
      speakBtn('Es ist '+(q.pk==='formal'?f:c.main))+'</div>'+
    '</div>';
  }
  const stats='<div class="stats"><div class="md-card filled stat"><span class="t-label-m">Racha</span><b>'+S.streak+'</b></div>'+
    '<div class="md-card filled stat"><span class="t-label-m">Mejor racha</span><b>'+S.best+'</b></div>'+
    '<div class="md-card filled stat"><span class="t-label-m">Aciertos</span><b>'+S.correct+'/'+S.total+'</b></div></div>';
  const settings='<div class="md-card outlined settings">'+
    '<div class="ctl"><span class="t-label-m">Nivel</span><div class="md-chips">'+[1,2,3].map(function(l){
      return chip(LVL[l],S.level===l,'data-act="level" data-v="'+l+'"');}).join('')+'</div></div>'+
    '<div class="ctl"><span class="t-label-m">Tipos de ejercicio</span><div class="md-chips">'+ALLT.map(function(t){
      return chip(TLAB[t],S.types.indexOf(t)>=0,'data-act="type" data-v="'+t+'"');}).join('')+'</div></div>'+
  '</div>';
  return stats+'<div class="md-card elevated quiz"><div class="qtop"><span class="md-chip static">'+TLAB[q.type]+'</span>'+(q.retry?'<span class="md-chip static accent">Repaso de un fallo</span>':'')+'</div>'+body+fb+'</div>'+settings;
}
function renderPractice(){
  view.innerHTML=quizHTML();
  if(S.answered!==null){const b=document.getElementById('nextbtn');if(b)b.focus({preventScroll:true});}
}
function answer(i){
  if(S.answered!==null||!S.q||i<0||i>=S.q.options.length) return;
  const q=S.q; S.answered=i; S.total++;
  if(q.options[i].correct){S.correct++;S.streak++;if(S.streak>S.best)S.best=S.streak;}
  else{S.streak=0;S.queue.push({type:q.type,pk:q.pk,h:q.h,m:q.m,wait:3+Math.floor(Math.random()*3)});}
  S.prev={h:q.h,m:q.m};
  persist();renderPractice();
}
function nextQ(){newQuestion();renderPractice();}

/* ---------- Navegación y eventos ---------- */
function setTab(t){
  S.tab=t;
  document.querySelectorAll('.md-nav-item').forEach(function(b){
    const on=b.dataset.tab===t;b.setAttribute('aria-selected',on?'true':'false');b.tabIndex=on?0:-1;
  });
  if(t==='study'){view.innerHTML=studyHTML();updateStudy();bindDrag();}
  else if(t==='practice'){if(!S.q)newQuestion();renderPractice();}
  else{view.innerHTML=tableHTML();}
}
document.querySelector('.md-nav').addEventListener('click',function(e){
  const b=e.target.closest('.md-nav-item');if(b){setTab(b.dataset.tab);window.scrollTo(0,0);}
});
view.addEventListener('click',function(e){
  const say=e.target.closest('[data-say]');
  if(say){speak(say.dataset.say);return;}
  const op=e.target.closest('[data-opt]');
  if(op){answer(parseInt(op.dataset.opt,10));return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act, st=S.study;
  if(S.tab==='study'){
    if(a==='h-')st.h=(st.h+23)%24;
    else if(a==='h+')st.h=(st.h+1)%24;
    else if(a==='m-'||a==='m+'){
      const T=norm(st.h*60+st.m+(a==='m+'?st.step:-st.step));
      st.h=Math.floor(T/60);st.m=T%60;
    }
    else if(a==='ampm')st.h=(st.h+12)%24;
    else if(a==='rand'){st.h=Math.floor(Math.random()*24);st.m=st.step===5?pick(allowedMinutes(3)):Math.floor(Math.random()*60);}
    else if(a==='now'){const d=new Date();st.h=d.getHours();st.m=d.getMinutes();if(st.step===5)snap5();}
    else if(a==='step5'){st.step=5;snap5();}
    else if(a==='step1')st.step=1;
    else if(a==='help')st.help=b.checked;
    updateStudy();
  } else if(S.tab==='table'){
    if(a==='th-'){S.tableH=(S.tableH+23)%24;view.innerHTML=tableHTML();}
    else if(a==='th+'){S.tableH=(S.tableH+1)%24;view.innerHTML=tableHTML();}
    else if(a==='load'){st.h=parseInt(b.dataset.h,10);st.m=parseInt(b.dataset.m,10);setTab('study');window.scrollTo(0,0);}
  } else if(S.tab==='practice'){
    if(a==='next')nextQ();
    else if(a==='level'){S.level=parseInt(b.dataset.v,10);persist();S.queue=[];newQuestion();renderPractice();}
    else if(a==='type'){
      const v=b.dataset.v, i=S.types.indexOf(v);
      if(i>=0){if(S.types.length>1)S.types.splice(i,1);}else S.types.push(v);
      persist();
      if(S.answered===null){newQuestion();}
      renderPractice();
    }
  }
});
document.addEventListener('keydown',function(e){
  if(S.tab!=='practice'||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&e.target.matches&&e.target.matches('input,textarea,select'))return;
  if(S.answered===null&&['1','2','3','4'].indexOf(e.key)>=0){answer(parseInt(e.key,10)-1);}
  else if(S.answered!==null&&(e.key==='n'||(e.key==='Enter'&&!(e.target&&e.target.closest&&e.target.closest('button'))))){e.preventDefault();nextQ();}
});
if(hasSpeech){try{speechSynthesis.getVoices();}catch(e){}}
setTab('study');
})();
</script>

<style>
/* Layout: una columna tipo app móvil. Colores de artículo = convención de estudio: der azul, die rojo, das verde. */
:root{
  --bg:#f2f5f9; --surface:#ffffff; --ink:#14202e; --muted:#5d6b7c; --line:#dbe2ea;
  --der:#2b6bd6; --die:#d2433b; --das:#2a9457; --accent:#14202e; --on-accent:#ffffff;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e141c; --surface:#17202b; --ink:#e7edf4; --muted:#93a1b2; --line:#263344;
  --der:#6fa0ff; --die:#ff8279; --das:#5fd38e; --accent:#e7edf4; --on-accent:#0e141c; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:18px 0 40px}
h1,h2,.de{font-family:var(--display);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--der);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:1.5rem;letter-spacing:-.01em;flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--muted)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:700;font-size:1.05rem}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.deck{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.deck h2{font-size:1.1rem;line-height:1.2}
.deck p{margin:4px 0 10px;color:var(--muted);font-size:.92rem}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--das)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn[disabled]{opacity:.4;cursor:default}
.prog{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 20px;min-height:290px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;margin:10px 0 14px}
.card .de{font-size:2.3rem;line-height:1.1;overflow-wrap:anywhere}
.card .es{font-size:1.3rem}
.card .sub{color:var(--muted);font-size:.98rem}
.art{font-weight:700}
.art.der{color:var(--der)}.art.die{color:var(--die)}.art.das{color:var(--das)}
.tag{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.snd{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 16px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.snd[hidden]{display:none}
.snd.on{border-color:var(--der);color:var(--der)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.art-btn{padding:18px 4px;border-radius:14px;border:2px solid currentColor;background:var(--surface);font-family:var(--display);font-weight:700;font-size:1.4rem}
.art-btn.der{color:var(--der)}.art-btn.die{color:var(--die)}.art-btn.das{color:var(--das)}
.art-btn.right{background:currentColor}.art-btn.right span{color:var(--surface)}
.art-btn.wrong{opacity:.35}
.fb{min-height:1.6em;font-weight:600}
.fb.ok{color:var(--das)}.fb.no{color:var(--die)}
.seg{display:flex;gap:6px;justify-content:center;margin:0 0 4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.foot{margin-top:22px;color:var(--muted);font-size:.85rem}
.foot a{color:inherit}
.done{text-align:center;padding:30px 0}
.done h2{font-size:1.8rem;margin-bottom:6px}

.rule{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;text-align:left}
.rule.g-der{background:color-mix(in srgb,var(--der) 12%,var(--surface))}
.rule.g-die{background:color-mix(in srgb,var(--die) 12%,var(--surface))}
.rule.g-das{background:color-mix(in srgb,var(--das) 12%,var(--surface))}
.rule p{margin:0}
.rule-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.end{font:600 .95rem ui-monospace,Menlo,Consolas,monospace;background:var(--surface);border:1px solid var(--line);padding:2px 9px;border-radius:6px}
.pill{display:inline-block;font-weight:600;font-size:.82rem;padding:1px 10px;border-radius:99px;background:var(--surface);border:1.5px solid currentColor}
.pill.der{color:var(--der)}.pill.die{color:var(--die)}.pill.das{color:var(--das)}
.tier{font-size:.82rem;color:var(--muted)}
.meta{font-size:.9rem;color:var(--muted)}.meta b{color:var(--ink);font-weight:600;margin-right:4px}
.status{font-weight:600}.status.ok{color:var(--das)}.status.bad{color:var(--die)}
.lede{color:var(--muted);margin:0 0 12px}
input.chk{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:inherit;margin-bottom:8px}
.chk-out{min-height:1.5em;margin-bottom:12px}
.t-der{color:var(--der);font-weight:700}.t-die{color:var(--die);font-weight:700}.t-das{color:var(--das);font-weight:700}
</style>
</head>

const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    return { k: d.id + ':' + de, t: noun ? 'n' : t, art: noun ? t : '', de, x: x === '-' ? '' : x, es, plOnly: false };

/* ---------- Pronunciación (Wiktionary → Wikimedia Commons) ---------- */
const audMem = new Map();
function pickAudio(files, word) {
  const au = files.filter(f => /\.(ogg|oga|opus|mp3|wav|flac)$/i.test(f) && /^(De-|LL-Q188 \(deu\))/i.test(f));
  const w = word.toLowerCase();
  const own = au.filter(f => f.toLowerCase().includes(w));
  const pool = own.length ? own : [];
  return pool.find(f => /^De-/i.test(f) && !/^De-(at|ch)-/i.test(f)) || pool.find(f => /^LL-Q188/i.test(f)) || pool[0] || null;
}
function findAudio(word) {
  if (/\s/.test(word)) return Promise.resolve(null);
  const cached = lsGet('aud:' + word, undefined);
  if (cached !== undefined) return Promise.resolve(cached === 0 ? null : cached);
  if (audMem.has(word)) return audMem.get(word);
  const p = (async () => {
    let reached = false;
    for (const host of ['de.wiktionary.org', 'en.wiktionary.org']) {
      try {
        const r = await fetch('https://' + host + '/w/api.php?action=query&titles=' + encodeURIComponent(word) + '&prop=images&imlimit=100&format=json&origin=*');
        const j = await r.json();
        reached = true;
        const files = [];
        Object.values((j.query && j.query.pages) || {}).forEach(pg => (pg.images || []).forEach(i => files.push(i.title.replace(/^[^:]+:/, ''))));
        const f = pickAudio(files, word);
        if (f) {
          const url = 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(f.replace(/ /g, '_'));
          lsSet('aud:' + word, url);
          return url;
        }
      } catch (e) { /* sin red o bloqueado: no se guarda como “sin audio” */ }
    }
    if (reached) lsSet('aud:' + word, 0);
    return null;
  })();
  audMem.set(word, p);
  return p;
}
function audioBtn(word) {
  return '<button class="snd" data-w="' + esc(word) + '" hidden aria-label="Escuchar ' + esc(word) + '">🔊 Escuchar</button>';
}
function wireAudio() {
  document.querySelectorAll('.snd[data-w]').forEach(b => {
    const w = b.dataset.w;
    findAudio(w).then(u => {
      if (!u || !document.body.contains(b)) return;
      b.hidden = false;
      b.onclick = () => {
        const a = new Audio(u);
        b.classList.add('on');
        a.onended = a.onerror = () => b.classList.remove('on');
        a.play().catch(() => b.classList.remove('on'));
      };
    });
  });
}
const prefetch = w => { if (w) findAudio(w.de); };

SUF('ade','die','strong',['Limonade','Schokolade','Fassade'],[],'Préstamos del francés.'),
SUF('ette','die','strong',['Zigarette','Toilette','Kassette'],['Raclette'],'Diminutivo francés.'),
SUF('e','die','strong',['Lampe','Katze','Straße','Blume'],['Name','Käse','Junge','Kollege','Neffe','Löwe','Hase','Affe','Ende','Auge','Interesse','Erbe'],'La mayoría de los sustantivos en -e son femeninos. Los masculinos suelen ser personas y animales (der Junge, der Löwe); los neutros son pocos (das Ende, das Auge).',{no:'ee$'}),
SUF('a','die','tend',['Kamera','Pizza','Villa'],['Sofa','Opa','Papa','Panda','Koala'],'Muchos préstamos en -a son femeninos. Las palabras griegas en -ma son neutras, ver -ma.'),
SUF('ismus','der','sure',['Tourismus','Realismus','Journalismus'],[],'Movimientos y doctrinas (como -ismo).'),
SUF('ling','der','sure',['Frühling','Lehrling','Liebling'],['Reling'],'Personas y cosas definidas por un rasgo.'),
SUF('ig','der','strong',['Honig','König','Essig','Käfig'],[],'Masculinos, con muy pocas excepciones.'),
SUF('or','der','strong',['Motor','Doktor','Autor','Humor'],['Tor','Labor','Moor'],'Agentes y máquinas de origen latino.'),
SUF('ist','der','strong',['Journalist','Tourist','Polizist'],['Frist','List'],'Personas con una profesión o una creencia.'),
SUF('eur','der','sure',['Friseur','Ingenieur','Masseur'],[],'Agentes franceses, personas.'),
SUF('är','der','strong',['Sekretär','Millionär','Aktionär'],['Militär'],'Personas, del francés -aire.'),
SUF('ant','der','strong',['Praktikant','Elefant','Diamant'],['Restaurant'],'Sobre todo personas y animales.'),
SUF('ent','der','strong',['Student','Präsident','Assistent'],['Patent','Talent','Prozent','Event'],'Sobre todo personas. Las cosas en -ent suelen ser neutras.'),
SUF('us','der','strong',['Bus','Zirkus','Kaktus','Rhythmus'],['Virus','Genus','Plus','Minus'],'Préstamos latinos.',{no:'aus$'}),
SUF('er','der','tend',['Computer','Lehrer','Fahrer','Hammer'],['Mutter','Schwester','Tochter','Butter','Leiter','Feder','Fenster','Zimmer','Wasser','Messer','Wetter','Fieber','Ufer','Wunder','Bier'],'Quien hace algo y las herramientas son masculinos. El parentesco (Mutter, Schwester) es femenino y muchos objetos son neutros.'),
SUF('en','der','tend',['Garten','Boden','Wagen','Kuchen'],['Becken','Kissen','Zeichen','Wappen','Leben','Essen'],'Masculino en la mayoría. Los verbos usados como sustantivo son neutros (essen → das Essen).'),
SUF('chen','das','sure',['Mädchen','Brötchen','Häuschen'],[],'Diminutivo. Siempre neutro, incluso para personas (das Mädchen).'),
SUF('lein','das','sure',['Fräulein','Büchlein','Männlein'],[],'Diminutivo, como -chen.'),
SUF('ment','das','strong',['Dokument','Instrument','Element','Parlament'],['Zement','Moment'],'Préstamos latinos para cosas.'),
SUF('tum','das','strong',['Eigentum','Wachstum','Christentum'],['Irrtum','Reichtum'],'Neutro salvo dos masculinos.'),
SUF('um','das','strong',['Museum','Zentrum','Datum','Studium'],[],'Sustantivos neutros latinos.'),
SUF('ma','das','strong',['Thema','Drama','Klima','Komma'],['Mama','Firma'],'Préstamos griegos.'),
SUF('o','das','tend',['Auto','Foto','Kino','Büro','Video'],['Euro','Zoo','Cappuccino','Espresso','Tango'],'Muchos préstamos en -o son neutros, pero varias bebidas y bailes son masculinos.'),
SUF('ett','das','strong',['Bett','Ballett','Brett'],[],'Neutro casi siempre.'),
SUF('nis','das','tend',['Ergebnis','Ereignis','Zeugnis','Geheimnis'],['Kenntnis','Erlaubnis','Wildnis','Erkenntnis'],'Neutro más veces que no, pero bastantes son femeninos.'),
SUF('al','das','tend',['Material','Ideal','Signal','Kapital'],['Kanal','Saal','Wal','Skandal','Qual'],'Neutro en muchos préstamos. Varias palabras cortas son masculinas.'),
SUF('ing','das','tend',['Meeting','Training','Marketing','Shopping'],['Hering','Schilling'],'Los anglicismos son neutros.',{min:6}),
PRE('ge','das','tend',['Gebäude','Gemüse','Gebirge','Gespräch'],['Gedanke','Gesang','Gewinn','Gebrauch','Geruch','Geschmack','Gegner','Geburt','Gefahr','Geschichte','Gegend','Gemeinde'],'Los colectivos con Ge- son neutros. Muchos abstractos con Ge- son masculinos o femeninos.',{min:5}),
L('Días, meses y estaciones','der','sure',['montag','dienstag','mittwoch','donnerstag','freitag','samstag','sonnabend','sonntag','januar','februar','märz','april','mai','juni','juli','august','september','oktober','november','dezember','frühling','sommer','herbst','winter','morgen','mittag','abend'],['Montag','Juli','Sommer'],'Siempre masculinos. La excepción es die Nacht.'),
L('Clima y puntos cardinales','der','strong',['regen','schnee','wind','nebel','sturm','hagel','norden','süden','osten','westen'],['Regen','Wind','Norden'],'La mayoría de las palabras del clima son masculinas. Das Wetter, das Eis y das Gewitter no.'),
L('Metales','das','strong',['gold','silber','eisen','kupfer','zinn','blei','platin','messing'],['Gold','Silber','Eisen'],'Los metales son neutros. Der Stahl y der Zink son las excepciones principales.'),
L('Colores como sustantivo','das','sure',['rot','blau','gelb','grün','schwarz','weiß','grau','braun','lila'],['Blau','Rot','Grün'],'Un color usado como sustantivo es neutro (das Blau des Himmels).'),
L('Idiomas','das','sure',['deutsch','englisch','spanisch','französisch','italienisch','portugiesisch'],['Deutsch','Englisch','Spanisch'],'Los nombres de idiomas son neutros (das Deutsch).')
];
RULES.forEach(r => { r.exL = new Set((r.ex || []).map(x => x.toLowerCase())); });
const endLabel = r => r.k === 'suf' ? '-' + r.e : r.k === 'pre' ? r.e.charAt(0).toUpperCase() + r.e.slice(1) + '-' : r.e;
function matchRules(word) {
  const parts = String(word).trim().split(/\s+/);
  const w = parts[parts.length - 1].toLowerCase();
  const hits = [];
  for (const r of RULES) {
    let spec = 0;
    if (r.k === 'list') { if (r.words.includes(w)) spec = 99; }
    else if (r.k === 'suf') { const min = r.min || r.e.length + 1; if (w.length >= min && w.endsWith(r.e) && !(r.no && new RegExp(r.no).test(w))) spec = r.e.length; }
    else { const min = r.min || r.e.length + 3; if (w.length >= min && w.startsWith(r.e)) spec = r.e.length + 0.5; }
    if (spec) hits.push({ r, spec });
  }
  hits.sort((a, b) => b.spec - a.spec);
  return hits.map(h => h.r);
}
function ruleBody(r, extra) {
  const eg = r.eg.length ? '<p class="meta"><b>Ejemplos</b>' + r.eg.map(x => esc(r.g + ' ' + x)).join(' · ') + '</p>' : '';
  const ex = r.ex.length ? '<p class="meta"><b>Excepciones</b>' + r.ex.slice(0, 12).map(esc).join(', ') + (r.ex.length > 12 ? ' …' : '') + '</p>' : '';
  return '<div class="rule-head"><code class="end">' + esc(endLabel(r)) + '</code><span class="pill ' + r.g + '">' + r.g + '</span><span class="tier">' + LEVELS[r.l][0] + '</span></div>' +
    (extra || '') + '<p>' + esc(r.t) + '</p>' + eg + ex;
}
function ruleBlock(w) {
  const hits = matchRules(w.de);
  if (!hits.length) return '<section class="rule"><p><b>Ninguna regla de terminación aplica.</b> Esta hay que memorizarla. Aprende la palabra con su artículo: <b>' + esc(w.art + ' ' + w.de) + '</b>.</p></section>';
  const p = hits[0];
  let st;
  if (w.art === p.g) st = '<p class="status ok">Esta palabra sigue la regla.</p>';
  else if (p.exL.has(w.de.toLowerCase())) st = '<p class="status bad">Es una excepción conocida. Memorízala como excepción.</p>';
  else st = '<p class="status bad">Esta palabra rompe el patrón. ' + (p.l === 'tend' ? 'Pasa con las tendencias.' : 'Agrégala a tus excepciones.') + '</p>';
  return '<section class="rule g-' + p.g + '">' + ruleBody(p, st) + '</section>';
}
let ruleFilter = '';
function rulesHtml() {
  return '<p class="lede">Terminaciones y grupos que predicen el artículo. Las fiables casi no tienen excepciones; las tendencias aciertan más veces que no. Cada regla lista sus excepciones.</p>' +
    '<input class="chk" id="chk" type="text" placeholder="Prueba una palabra: Wohnung" autocomplete="off" spellcheck="false" autocapitalize="off">' +
    '<div class="chk-out" id="chk-out" aria-live="polite"></div>' +
    '<div class="seg" id="rf" style="justify-content:flex-start;margin-bottom:12px">' + ['', 'der', 'die', 'das'].map(f => '<button data-f="' + f + '" aria-pressed="' + (ruleFilter === f) + '">' + (f || 'Todas') + '</button>').join('') + '</div>' +
    '<div id="rule-list">' + ruleListHtml() + '</div>';
}
const ruleListHtml = () => RULES.filter(r => !ruleFilter || r.g === ruleFilter).map(r => '<section class="rule g-' + r.g + '">' + ruleBody(r) + '</section>').join('');
function bindRules() {
  $('#chk').oninput = e => {
    const v = e.target.value.trim(), out = $('#chk-out');
    if (!v) { out.innerHTML = ''; return; }
    const h = matchRules(v);
    if (!h.length) { out.innerHTML = '<p>Ninguna regla aplica a <b>' + esc(v) + '</b>. Hay que aprenderla de memoria.</p>'; return; }
    const p = h[0];
    out.innerHTML = '<p>Mi mejor apuesta para <b>' + esc(v) + '</b>: <span class="t-' + p.g + '">' + p.g + '</span> por <code>' + esc(endLabel(p)) + '</code> (' + LEVELS[p.l][0].toLowerCase() + ').' +
      (h[1] && h[1].g !== p.g ? ' También coincide con <code>' + esc(endLabel(h[1])) + '</code>, que apunta a ' + h[1].g + '.' : '') + '</p>';
  };
  app.querySelectorAll('#rf button').forEach(b => b.onclick = () => {
    ruleFilter = b.dataset.f;
    app.querySelectorAll('#rf button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('#rule-list').innerHTML = ruleListHtml();
  });
}
function bindTabs() { app.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.lv = b.dataset.lv; lsSet('dk-ui', state); home(); }); }

/* ---------- Pantallas ---------- */
const app = $('#app');
let S = null; // sesión

function home() {
  S = null;
  const lvls = [['A1', 'A1'], ['A2', 'A2'], ['R', 'Reglas']];
  let h = '<div class="top"><h1>Easy Vokab Trainer</h1></div>';
  h += '<div class="tabs">' + lvls.map(l => '<button class="tab" data-lv="' + l[0] + '" aria-pressed="' + (state.lv === l[0]) + '">' + l[1] + '</button>').join('') + '</div>';
  if (state.lv === 'R') { app.innerHTML = h + rulesHtml(); bindTabs(); bindRules(); return; }
  D.filter(d => d.lv === state.lv).forEach(d => {
    const m = d.words.filter(w => box(w) >= MASTER).length;
    const nouns = d.words.filter(w => w.t === 'n').length;
    h += '<section class="deck"><h2>' + esc(d.title) + '</h2><p>' + esc(d.sub) + ' · ' + d.words.length + ' palabras</p>' +
      '<div class="bar"><i style="width:' + Math.round(100 * m / d.words.length) + '%"></i></div>' +
      '<div class="row"><button class="btn pri" data-go="cards" data-id="' + d.id + '">Tarjetas · ' + m + '/' + d.words.length + '</button>' +
      '<button class="btn" data-go="art" data-id="' + d.id + '"' + (nouns < 8 ? ' disabled' : '') + '>der · die · das</button></div></section>';
  });
  h += '<div class="foot">Audio: se busca en Wiktionary / Wikimedia Commons al mostrar cada palabra; el botón aparece solo si existe una grabación. Vocabulario seleccionado por frecuencia y tema, no es copia de la lista oficial del Goethe-Institut. ' +
    '<br><button class="ghost" id="exp" style="margin-top:10px">Copiar decks como JSON</button></div>';
  app.innerHTML = h;
  bindTabs();
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => start(b.dataset.id, b.dataset.go));
  $('#exp').onclick = async e => {
    const out = D.map(d => ({ id: d.id, level: d.lv, title: d.title, words: d.words.map(w => ({ de: w.de, article: w.art || undefined, type: w.t, extra: w.x || undefined, es: w.es })) }));
    try { await navigator.clipboard.writeText(JSON.stringify(out, null, 1)); e.target.textContent = 'Copiado'; }
    catch (err) { e.target.textContent = 'No se pudo copiar'; }
  };
}

function start(id, mode) {
  const d = D.find(x => x.id === id);
  let pool = d.words.filter(w => mode === 'art' ? w.t === 'n' : true);
  pool = shuffle(pool.slice()).sort((a, b) => box(a) - box(b));
  const q = shuffle(pool.slice(0, 20));
  S = { d, mode, q, i: 0, shown: false, right: 0, wrong: 0, again: new Set(), answered: false };
  mode === 'art' ? renderArt() : renderCard();
}

function head() {
  return '<div class="top"><button class="ghost" id="back" aria-label="Volver">←</button><h1>' + esc(S.d.title) + '</h1><span class="prog">' + Math.min(S.i + 1, S.q.length) + '/' + S.q.length + '</span></div>';
}
function bindBack() { $('#back').onclick = home; }
function finish() {
  app.innerHTML = '<div class="top"><button class="ghost" id="back">←</button><h1>' + esc(S.d.title) + '</h1></div>' +
    '<div class="done"><h2>Sesión lista</h2><p class="prog">' + S.right + ' acertadas · ' + S.wrong + ' para repasar</p>' +
    '<div class="row" style="margin-top:18px"><button class="btn pri" id="again">Otra sesión</button><button class="btn" id="hm">Ver decks</button></div></div>';
  $('#back').onclick = $('#hm').onclick = home;
  $('#again').onclick = () => start(S.d.id, S.mode);
}
function grade(w, ok) {
  prog[w.k] = ok ? Math.min(4, box(w) + 1) : 0;
  lsSet('dk-prog', prog);
  if (ok) S.right++; else { S.wrong++; if (!S.again.has(w.k)) { S.again.add(w.k); S.q.push(w); } }
}

/* Tarjetas */
function german(w) {
  const a = w.art ? '<span class="art ' + w.art + '">' + w.art + '</span> ' : '';
  return a + esc(w.de);
}
function renderCard() {
  if (S.i >= S.q.length) return finish();
  const w = S.q[S.i], dir = state.dir, front = dir === 'es-de';
  let c;
  if (!S.shown) {
    c = front
      ? '<div class="tag">Español</div><div class="de" style="font-size:2rem">' + esc(w.es) + '</div><div class="sub">' + (w.t === 'n' ? 'sustantivo' : w.t === 'v' ? 'verbo' : w.t === 'a' ? 'adjetivo' : 'palabra') + '</div>'
      : '<div class="tag">Alemán</div><div class="de">' + esc(w.de) + '</div>' + audioBtn(w.de);
  } else {
    c = '<div class="de">' + german(w) + '</div>' +
      (w.t === 'n' && w.x ? '<div class="sub">Plural: die ' + esc(w.x) + '</div>' : '') +
      (w.t === 'v' && w.x ? '<div class="sub">' + esc(w.x) + '</div>' : '') +
      '<div class="es">' + esc(w.es) + '</div>' + audioBtn(w.de);
  }
  app.innerHTML = head() +
    '<div class="seg"><button data-d="es-de" aria-pressed="' + (dir === 'es-de') + '">ES → DE</button><button data-d="de-es" aria-pressed="' + (dir === 'de-es') + '">DE → ES</button></div>' +
    '<div class="card" id="card">' + c + '</div>' +
    (S.shown
      ? '<div class="row"><button class="btn" id="no">Repasar</button><button class="btn pri" id="yes">Lo sé</button></div>'
      : '<div class="row"><button class="btn pri" id="flip">Mostrar respuesta</button></div>');
  bindBack();
  app.querySelectorAll('.seg button').forEach(b => b.onclick = () => { state.dir = b.dataset.d; lsSet('dk-ui', state); S.shown = false; renderCard(); });
  if (!S.shown) {
    $('#flip').onclick = () => { S.shown = true; renderCard(); };
    $('#card').onclick = e => { if (!e.target.closest('.snd')) { S.shown = true; renderCard(); } };
  } else {
    $('#yes').onclick = () => { grade(w, true); S.i++; S.shown = false; renderCard(); };
    $('#no').onclick = () => { grade(w, false); S.i++; S.shown = false; renderCard(); };
  }
  wireAudio(); prefetch(S.q[S.i + 1]);
}

/* der · die · das */
function renderArt() {
  if (S.i >= S.q.length) return finish();
  const w = S.q[S.i];
  const a = S.answered;
  const btns = ['der', 'die', 'das'].map(x => '<button class="art-btn ' + x + (a ? (x === w.art ? ' right' : ' wrong') : '') + '" data-a="' + x + '"' + (a ? ' disabled' : '') + '><span>' + x + '</span></button>').join('');
  app.innerHTML = head() +
    '<div class="card"><div class="tag">¿Qué artículo?</div><div class="de">' + (a ? german(w) : esc(w.de)) + '</div>' +
    (w.x ? '<div class="sub">Plural: die ' + esc(w.x) + '</div>' : '') +
    '<div class="es">' + esc(w.es) + '</div>' + audioBtn(w.de) +
    '<div class="fb ' + (a ? (S.lastOk ? 'ok' : 'no') : '') + '">' + (a ? (S.lastOk ? 'Correcto' : 'Era ' + w.art + ' ' + esc(w.de)) : '') + '</div></div>' +
    '<div class="three">' + btns + '</div>' +
    (a ? '<div class="row" style="margin:14px 0"><button class="btn pri" id="next">Siguiente</button></div>' + ruleBlock(w) : '');
  bindBack();
  if (!a) app.querySelectorAll('.art-btn').forEach(b => b.onclick = () => {
    S.lastOk = b.dataset.a === w.art; grade(w, S.lastOk); S.answered = true; renderArt();
  });
  else $('#next').onclick = () => { S.i++; S.answered = false; renderArt(); };
  wireAudio(); prefetch(S.q[S.i + 1]);
}

home();
</script>

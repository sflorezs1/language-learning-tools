<style>
/* Artículos: der = primary (azul), die = error (rojo), das = success (verde); ver .md-gender-* en material.css */
.view{max-width:960px;margin:0 auto}
.session{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.decks{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.deck{display:flex;flex-direction:column;gap:12px}
.deck-meta{display:flex;justify-content:space-between;gap:8px;color:var(--md-on-surface-variant)}
.deck .md-row{margin-top:4px}
.note{margin-top:24px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.s-top{display:flex;align-items:center;gap:16px}
.s-top .md-progress{flex:1}
.flash{min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px 16px}
.flash .word{overflow-wrap:anywhere}
.art{font-weight:500;color:var(--c)}
.cap{color:var(--md-on-surface-variant);text-transform:uppercase}
.actions{display:flex;gap:8px}
.actions .md-btn{flex:1}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.art-btn{position:relative;overflow:hidden;min-height:72px;border:2px solid var(--c);border-radius:16px;background:transparent;color:var(--c);font:500 24px/32px var(--md-font);letter-spacing:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.art-btn::before{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.art-btn:hover:not(:disabled)::before{opacity:.08}
.art-btn.right{background:var(--c);color:var(--on-c)}
.art-btn.wrong{background:var(--cc);color:var(--on-cc);border-style:dashed}
.art-btn:disabled{cursor:default}
.art-btn:disabled:not(.right):not(.wrong){opacity:.38}
.verdict{display:flex;align-items:center;gap:8px;min-height:28px}
.verdict.ok{color:var(--md-success)}.verdict.no{color:var(--md-error)}
.badge{display:inline-block;padding:0 10px;border-radius:999px;background:var(--c);color:var(--on-c);font:500 12px/20px var(--md-font);letter-spacing:.5px}
.rule-card{background:var(--cc);color:var(--on-cc);display:flex;flex-direction:column;gap:8px}
.rule-card.none{background:var(--md-surface-container-high);color:var(--md-on-surface)}
.rule-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.end{padding:0 8px;border-radius:4px;background:var(--md-surface);color:var(--md-on-surface);font:500 14px/24px ui-monospace,Menlo,Consolas,monospace}
.rule-card .meta b{margin-right:6px}
.status{display:flex;align-items:center;gap:8px;font-weight:500}
.rules{display:flex;flex-direction:column;gap:12px}
.rules-top{display:flex;flex-direction:column;gap:16px;margin-bottom:16px}
.chk-out{min-height:24px}
.t-der{color:var(--md-primary);font-weight:500}.t-die{color:var(--md-error);font-weight:500}.t-das{color:var(--md-success);font-weight:500}
.playing .md-icon{font-variation-settings:"FILL" 1,"wght" 400,"GRAD" 0,"opsz" 20}
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px 0}
.done .md-row{justify-content:center;margin-top:16px}
</style>
</head>

const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- Pronunciación (Wiktionary → Wikimedia Commons) ---------- */
const audMem = new Map();
function pickAudio(files, word) {
  const au = files.filter(f => /\.(ogg|oga|opus|mp3|wav|flac)$/i.test(f) && /^(De-|LL-Q188 \(deu\))/i.test(f));
  const w = word.toLowerCase();
  const own = au.filter(f => f.toLowerCase().includes(w));
  const pool = own.length ? own : [];
  return pool.find(f => /^De-/i.test(f) && !/^De-(at|ch)-/i.test(f)) || pool.find(f => /^LL-Q188/i.test(f)) || pool[0] || null;
}
function findAudio(word) {
  if (/\s/.test(word)) return Promise.resolve(null);
  const cached = lsGet('aud:' + word, undefined);
  if (cached !== undefined) return Promise.resolve(cached === 0 ? null : cached);
  if (audMem.has(word)) return audMem.get(word);
  const p = (async () => {
    let reached = false;
    for (const host of ['de.wiktionary.org', 'en.wiktionary.org']) {
      try {
        const r = await fetch('https://' + host + '/w/api.php?action=query&titles=' + encodeURIComponent(word) + '&prop=images&imlimit=100&format=json&origin=*');
        const j = await r.json();
        reached = true;
        const files = [];
        Object.values((j.query && j.query.pages) || {}).forEach(pg => (pg.images || []).forEach(i => files.push(i.title.replace(/^[^:]+:/, ''))));
        const f = pickAudio(files, word);
        if (f) {
          const url = 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(f.replace(/ /g, '_'));
          lsSet('aud:' + word, url);
          return url;
        }
      } catch (e) { /* sin red o bloqueado: no se guarda como “sin audio” */ }
    }
    if (reached) lsSet('aud:' + word, 0);
    return null;
  })();
  audMem.set(word, p);
  return p;
}

function audioBtn(word) {
  return '<button class="md-btn tonal has-icon snd" data-w="' + esc(word) + '" hidden aria-label="Escuchar ' + esc(word) + '"><span class="md-icon" aria-hidden="true">volume_up</span>Escuchar</button>';
}
function wireAudio() {
  document.querySelectorAll('.snd[data-w]').forEach(b => {
    const w = b.dataset.w;
    findAudio(w).then(u => {
      if (!u || !document.body.contains(b)) return;
      b.hidden = false;
      b.onclick = () => {
        const a = new Audio(u);
        b.classList.add('playing');
        a.onended = a.onerror = () => b.classList.remove('playing');
        a.play().catch(() => { b.classList.remove('playing'); snack('No se pudo reproducir el audio.'); });
      };
    });
  });
}
const prefetch = w => { if (w) findAudio(w.de); };

let snackT = null;
function snack(msg) {
  const s = $('#snack'); s.textContent = msg; s.classList.add('show');
  clearTimeout(snackT); snackT = setTimeout(() => s.classList.remove('show'), 2800);
}

SUF('ent','der','strong',['Student','Präsident','Assistent'],['Patent','Talent','Prozent','Event'],'Sobre todo personas. Las cosas en -ent suelen ser neutras.'),
SUF('us','der','strong',['Bus','Zirkus','Kaktus','Rhythmus'],['Virus','Genus','Plus','Minus'],'Préstamos latinos.',{no:'aus$'}),

SUF('en','der','tend',['Garten','Boden','Wagen','Kuchen'],['Becken','Kissen','Zeichen','Wappen','Leben','Essen'],'Masculino en la mayoría. Los verbos usados como sustantivo son neutros (essen → das Essen).'),
SUF('chen','das','sure',['Mädchen','Brötchen','Häuschen'],[],'Diminutivo. Siempre neutro, incluso para personas (das Mädchen).'),
SUF('lein','das','sure',['Fräulein','Büchlein','Männlein'],[],'Diminutivo, como -chen.'),
SUF('ment','das','strong',['Dokument','Instrument','Element','Parlament'],['Zement','Moment'],'Préstamos latinos para cosas.'),
SUF('tum','das','strong',['Eigentum','Wachstum','Christentum'],['Irrtum','Reichtum'],'Neutro salvo dos masculinos.'),
SUF('um','das','strong',['Museum','Zentrum','Datum','Studium'],[],'Sustantivos neutros latinos.'),

SUF('ett','das','strong',['Bett','Ballett','Brett'],[],'Neutro casi siempre.'),

SUF('al','das','tend',['Material','Ideal','Signal','Kapital'],['Kanal','Saal','Wal','Skandal','Qual'],'Neutro en muchos préstamos. Varias palabras cortas son masculinas.'),
SUF('ing','das','tend',['Meeting','Training','Marketing','Shopping'],['Hering','Schilling'],'Los anglicismos son neutros.',{min:6}),
PRE('ge','das','tend',['Gebäude','Gemüse','Gebirge','Gespräch'],['Gedanke','Gesang','Gewinn','Gebrauch','Geruch','Geschmack','Gegner','Geburt','Gefahr','Geschichte','Gegend','Gemeinde'],'Los colectivos con Ge- son neutros. Muchos abstractos con Ge- son masculinos o femeninos.',{min:5}),
L('Días, meses y estaciones','der','sure',['montag','dienstag','mittwoch','donnerstag','freitag','samstag','sonnabend','sonntag','januar','februar','märz','april','mai','juni','juli','august','september','oktober','november','dezember','frühling','sommer','herbst','winter','morgen','mittag','abend'],['Montag','Juli','Sommer'],'Siempre masculinos. La excepción es die Nacht.'),
L('Clima y puntos cardinales','der','strong',['regen','schnee','wind','nebel','sturm','hagel','norden','süden','osten','westen'],['Regen','Wind','Norden'],'La mayoría de las palabras del clima son masculinas. Das Wetter, das Eis y das Gewitter no.'),
L('Metales','das','strong',['gold','silber','eisen','kupfer','zinn','blei','platin','messing'],['Gold','Silber','Eisen'],'Los metales son neutros. Der Stahl y der Zink son las excepciones principales.'),
L('Colores como sustantivo','das','sure',['rot','blau','gelb','grün','schwarz','weiß','grau','braun','lila'],['Blau','Rot','Grün'],'Un color usado como sustantivo es neutro (das Blau des Himmels).'),
L('Idiomas','das','sure',['deutsch','englisch','spanisch','französisch','italienisch','portugiesisch'],['Deutsch','Englisch','Spanisch'],'Los nombres de idiomas son neutros (das Deutsch).')
];
RULES.forEach(r => { r.exL = new Set((r.ex || []).map(x => x.toLowerCase())); });
const endLabel = r => r.k === 'suf' ? '-' + r.e : r.k === 'pre' ? r.e.charAt(0).toUpperCase() + r.e.slice(1) + '-' : r.e;
function matchRules(word) {
  const parts = String(word).trim().split(/\s+/);
  const w = parts[parts.length - 1].toLowerCase();
  const hits = [];
  for (const r of RULES) {
    let spec = 0;
    if (r.k === 'list') { if (r.words.includes(w)) spec = 99; }
    else if (r.k === 'suf') { const min = r.min || r.e.length + 1; if (w.length >= min && w.endsWith(r.e) && !(r.no && new RegExp(r.no).test(w))) spec = r.e.length; }
    else { const min = r.min || r.e.length + 3; if (w.length >= min && w.startsWith(r.e)) spec = r.e.length + 0.5; }
    if (spec) hits.push({ r, spec });
  }
  hits.sort((a, b) => b.spec - a.spec);
  return hits.map(h => h.r);
}

const GICON = { ok: 'check_circle', bad: 'error' };
function ruleBody(r, extra) {
  const eg = r.eg.length ? '<p class="t-body-m meta"><b>Ejemplos</b>' + r.eg.map(x => esc(r.g + ' ' + x)).join(' · ') + '</p>' : '';
  const ex = r.ex.length ? '<p class="t-body-m meta"><b>Excepciones</b>' + r.ex.slice(0, 12).map(esc).join(', ') + (r.ex.length > 12 ? ' …' : '') + '</p>' : '';
  return '<div class="rule-head"><code class="end">' + esc(endLabel(r)) + '</code><span class="badge">' + r.g + '</span><span class="t-label-m">' + LEVELS[r.l][0] + '</span></div>' +
    (extra || '') + '<p class="t-body-m">' + esc(r.t) + '</p>' + eg + ex;
}
function ruleCard(r, extra) { return '<section class="md-card rule-card md-gender-' + r.g + '">' + ruleBody(r, extra) + '</section>'; }
function ruleBlock(w) {
  const hits = matchRules(w.de);
  if (!hits.length) return '<section class="md-card rule-card none"><p class="t-body-m"><b>Ninguna regla de terminación aplica.</b> Esta hay que memorizarla. Aprende la palabra con su artículo: <b>' + esc(w.art + ' ' + w.de) + '</b>.</p></section>';
  const p = hits[0];
  let st;
  if (w.art === p.g) st = '<p class="status t-body-m"><span class="md-icon fill" aria-hidden="true">check_circle</span>Esta palabra sigue la regla.</p>';
  else if (p.exL.has(w.de.toLowerCase())) st = '<p class="status t-body-m"><span class="md-icon fill" aria-hidden="true">error</span>Es una excepción conocida. Memorízala como excepción.</p>';
  else st = '<p class="status t-body-m"><span class="md-icon fill" aria-hidden="true">error</span>Esta palabra rompe el patrón. ' + (p.l === 'tend' ? 'Pasa con las tendencias.' : 'Agrégala a tus excepciones.') + '</p>';
  return ruleCard(p, st);
}
let ruleFilter = '';
const chip = (label, pressed, attrs) => '<button class="md-chip" aria-pressed="' + pressed + '" ' + attrs + '><span class="md-icon" aria-hidden="true">check</span>' + label + '</button>';
function rulesHtml() {
  return '<div class="rules-top"><p class="t-body-l muted">Terminaciones y grupos que predicen el artículo. Las fiables casi no tienen excepciones; las tendencias aciertan más veces que no. Cada regla lista sus excepciones.</p>' +
    '<label class="md-field"><input class="chk" id="chk" type="text" placeholder=" " autocomplete="off" spellcheck="false" autocapitalize="off"><span>Prueba una palabra, por ejemplo Wohnung</span></label>' +
    '<div class="chk-out t-body-l" id="chk-out" aria-live="polite"></div>' +
    '<div class="md-chips" id="rf" role="group" aria-label="Filtrar por artículo">' + ['', 'der', 'die', 'das'].map(f => chip(f || 'Todas', ruleFilter === f, 'data-f="' + f + '"')).join('') + '</div></div>' +
    '<div class="rules" id="rule-list">' + ruleListHtml() + '</div>';
}
const ruleListHtml = () => RULES.filter(r => !ruleFilter || r.g === ruleFilter).map(r => ruleCard(r)).join('');
function bindRules() {
  $('#chk').oninput = e => {
    const v = e.target.value.trim(), out = $('#chk-out');
    if (!v) { out.innerHTML = ''; return; }
    const h = matchRules(v);
    if (!h.length) { out.innerHTML = 'Ninguna regla aplica a <b>' + esc(v) + '</b>. Hay que aprenderla de memoria.'; return; }
    const p = h[0];
    out.innerHTML = 'Mi mejor apuesta para <b>' + esc(v) + '</b>: <span class="t-' + p.g + '">' + p.g + '</span> por <code>' + esc(endLabel(p)) + '</code> (' + LEVELS[p.l][0].toLowerCase() + ').' +
      (h[1] && h[1].g !== p.g ? ' También coincide con <code>' + esc(endLabel(h[1])) + '</code>, que apunta a ' + h[1].g + '.' : '');
  };
  app.querySelectorAll('#rf .md-chip').forEach(b => b.onclick = () => {
    ruleFilter = b.dataset.f;
    app.querySelectorAll('#rf .md-chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    $('#rule-list').innerHTML = ruleListHtml();
  });
}

/* ---------- Pantallas ---------- */
const app = $('#app');
let S = null; // sesión activa

function setBar(title, inSession) {
  $('#title').textContent = title;
  const up = $('#up');
  up.setAttribute('aria-label', inSession ? 'Volver a los decks' : 'Todas las herramientas');
}
function setNav(lv) { document.querySelectorAll('.md-nav-item').forEach(b => b.setAttribute('aria-selected', String(b.dataset.lv === lv))); }
$('#up').addEventListener('click', e => { if (S) { e.preventDefault(); home(); } });
document.querySelectorAll('.md-nav-item').forEach(b => b.addEventListener('click', () => { state.lv = b.dataset.lv; lsSet('dk-ui', state); home(); }));

function home() {
  S = null;
  setBar('Easy Vokab Trainer', false);
  setNav(state.lv);
  window.scrollTo(0, 0);
  if (state.lv === 'R') { app.innerHTML = rulesHtml(); bindRules(); return; }
  let h = '<div class="decks">';
  D.filter(d => d.lv === state.lv).forEach(d => {
    const m = d.words.filter(w => box(w) >= MASTER).length;
    const nouns = d.words.filter(w => w.t === 'n').length;
    const pct = Math.round(100 * m / d.words.length);
    h += '<section class="md-card elevated deck"><div><h2 class="t-title-l">' + esc(d.title) + '</h2><p class="t-body-m muted">' + esc(d.sub) + '</p></div>' +
      '<div><div class="deck-meta t-label-m"><span>' + m + ' de ' + d.words.length + ' dominadas</span><span>' + pct + '%</span></div>' +
      '<div class="md-progress" role="progressbar" aria-label="Progreso del deck" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '" style="margin-top:6px"><i style="width:' + pct + '%"></i></div></div>' +
      '<div class="md-row"><button class="md-btn filled has-icon" data-go="cards" data-id="' + d.id + '"><span class="md-icon" aria-hidden="true">style</span>Tarjetas</button>' +
      '<button class="md-btn tonal has-icon" data-go="art" data-id="' + d.id + '"' + (nouns < 8 ? ' disabled' : '') + '><span class="md-icon" aria-hidden="true">rule</span>der · die · das</button></div></section>';
  });
  h += '</div><div class="note"><p class="t-body-s muted">Audio: se busca en Wiktionary y Wikimedia Commons al mostrar cada palabra; el botón aparece solo si existe una grabación. Vocabulario seleccionado por frecuencia y tema, no es copia de la lista oficial del Goethe-Institut.</p>' +
    '<button class="md-btn text has-icon" id="exp"><span class="md-icon" aria-hidden="true">content_copy</span>Copiar decks como JSON</button></div>';
  app.innerHTML = h;
  app.querySelectorAll('[data-go]').forEach(b => b.onclick = () => start(b.dataset.id, b.dataset.go));
  $('#exp').onclick = async () => {
    const out = D.map(d => ({ id: d.id, level: d.lv, title: d.title, words: d.words.map(w => ({ de: w.de, article: w.art || undefined, type: w.t, extra: w.x || undefined, es: w.es })) }));
    try { await navigator.clipboard.writeText(JSON.stringify(out, null, 1)); snack('Decks copiados al portapapeles.'); }
    catch (err) { snack('No se pudo copiar.'); }
  };
}

function start(id, mode) {
  const d = D.find(x => x.id === id);
  let pool = d.words.filter(w => mode === 'art' ? w.t === 'n' : true);
  pool = shuffle(pool.slice()).sort((a, b) => box(a) - box(b));
  const q = shuffle(pool.slice(0, 20));
  S = { d, mode, q, i: 0, shown: false, right: 0, wrong: 0, again: new Set(), answered: false };
  window.scrollTo(0, 0);
  mode === 'art' ? renderArt() : renderCard();
}

function sessionTop() {
  setBar(S.d.title, true);
  const pct = Math.round(100 * Math.min(S.i, S.q.length) / S.q.length);
  return '<div class="s-top"><div class="md-progress" role="progressbar" aria-label="Avance de la sesión" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
    '<span class="t-label-l">' + Math.min(S.i + 1, S.q.length) + ' / ' + S.q.length + '</span></div>';
}
function finish() {
  setBar(S.d.title, true);
  app.innerHTML = '<div class="session"><div class="done"><span class="md-icon fill" style="width:48px;height:48px;font-size:48px;color:var(--md-success)" aria-hidden="true">check_circle</span>' +
    '<h2 class="t-headline-s">Sesión lista</h2><p class="t-body-l muted">' + S.right + ' acertadas · ' + S.wrong + ' para repasar</p>' +
    '<div class="md-row"><button class="md-btn filled" id="again">Otra sesión</button><button class="md-btn outlined" id="hm">Ver decks</button></div></div></div>';
  $('#hm').onclick = home;
  $('#again').onclick = () => start(S.d.id, S.mode);
}
function grade(w, ok) {
  prog[w.k] = ok ? Math.min(4, box(w) + 1) : 0;
  lsSet('dk-prog', prog);
  if (ok) S.right++; else { S.wrong++; if (!S.again.has(w.k)) { S.again.add(w.k); S.q.push(w); } }
}

/* Tarjetas */
function german(w) {
  const a = w.art ? '<span class="art md-gender-' + w.art + '">' + w.art + '</span> ' : '';
  return a + esc(w.de);
}
function renderCard() {
  if (S.i >= S.q.length) return finish();
  const w = S.q[S.i], dir = state.dir, front = dir === 'es-de';
  let c;
  if (!S.shown) {
    c = front
      ? '<span class="t-label-m cap">Español</span><div class="word t-display-s">' + esc(w.es) + '</div><p class="t-body-m muted">' + (w.t === 'n' ? 'sustantivo' : w.t === 'v' ? 'verbo' : w.t === 'a' ? 'adjetivo' : 'palabra') + '</p>'
      : '<span class="t-label-m cap">Alemán</span><div class="word t-display-s">' + esc(w.de) + '</div>' + audioBtn(w.de);
  } else {
    c = '<div class="word t-display-s">' + german(w) + '</div>' +
      (w.t === 'n' && w.x ? '<p class="t-body-l muted">Plural: die ' + esc(w.x) + '</p>' : '') +
      (w.t === 'v' && w.x ? '<p class="t-body-l muted">' + esc(w.x) + '</p>' : '') +
      '<p class="t-title-l">' + esc(w.es) + '</p>' + audioBtn(w.de);
  }
  app.innerHTML = '<div class="session">' + sessionTop() +
    '<div class="md-seg" role="group" aria-label="Dirección"><button data-d="es-de" aria-pressed="' + (dir === 'es-de') + '"><span class="md-icon" aria-hidden="true">check</span>ES → DE</button><button data-d="de-es" aria-pressed="' + (dir === 'de-es') + '"><span class="md-icon" aria-hidden="true">check</span>DE → ES</button></div>' +
    '<section class="md-card filled flash" id="card">' + c + '</section>' +
    (S.shown
      ? '<div class="actions"><button class="md-btn outlined lg" id="no">Repasar</button><button class="md-btn filled lg" id="yes">Lo sé</button></div>'
      : '<div class="actions"><button class="md-btn filled lg" id="flip">Mostrar respuesta</button></div>') + '</div>';
  app.querySelectorAll('.md-seg button').forEach(b => b.onclick = () => { state.dir = b.dataset.d; lsSet('dk-ui', state); S.shown = false; renderCard(); });
  if (!S.shown) {
    $('#flip').onclick = () => { S.shown = true; renderCard(); };
    $('#card').onclick = e => { if (!e.target.closest('.snd')) { S.shown = true; renderCard(); } };
  } else {
    $('#yes').onclick = () => { grade(w, true); S.i++; S.shown = false; renderCard(); };
    $('#no').onclick = () => { grade(w, false); S.i++; S.shown = false; renderCard(); };
  }
  wireAudio(); prefetch(S.q[S.i + 1]);
}

/* der · die · das */
function renderArt() {
  if (S.i >= S.q.length) return finish();
  const w = S.q[S.i];
  const a = S.answered;
  const btns = ['der', 'die', 'das'].map(x => '<button class="art-btn md-gender-' + x + (a ? (x === w.art ? ' right' : (S.chosen === x ? ' wrong' : '')) : '') + '" data-a="' + x + '"' + (a ? ' disabled' : '') + '>' + x + '</button>').join('');
  app.innerHTML = '<div class="session">' + sessionTop() +
    '<section class="md-card filled flash"><span class="t-label-m cap">¿Qué artículo?</span><div class="word t-display-s">' + (a ? german(w) : esc(w.de)) + '</div>' +
    (w.x ? '<p class="t-body-l muted">Plural: die ' + esc(w.x) + '</p>' : '') +
    '<p class="t-title-l">' + esc(w.es) + '</p>' + audioBtn(w.de) +
    '<div class="verdict t-title-m ' + (a ? (S.lastOk ? 'ok' : 'no') : '') + '" aria-live="polite">' +
    (a ? '<span class="md-icon fill" aria-hidden="true">' + (S.lastOk ? 'check_circle' : 'cancel') + '</span>' + (S.lastOk ? 'Correcto' : 'Era ' + esc(w.art + ' ' + w.de)) : '') + '</div></section>' +
    '<div class="three">' + btns + '</div>' +
    (a ? '<button class="md-btn filled lg block" id="next">Siguiente</button>' + ruleBlock(w) : '') + '</div>';
  if (!a) app.querySelectorAll('.art-btn').forEach(b => b.onclick = () => {
    S.chosen = b.dataset.a; S.lastOk = S.chosen === w.art; grade(w, S.lastOk); S.answered = true; renderArt();
  });
  else { $('#next').onclick = () => { S.i++; S.answered = false; renderArt(); window.scrollTo(0, 0); }; $('#next').focus({ preventScroll: true }); }
  wireAudio(); prefetch(S.q[S.i + 1]);
}

home();
</script>
</body>
